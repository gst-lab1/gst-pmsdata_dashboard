<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구소 업무관리</title>
<style>
:root{
  --navy:#1b2a5c; --navy2:#17264f; --soft:#f8f9fc; --soft2:#eef1f7; --hov:#f6f8ff; --side:#ffffff; --pri:#2f5bd9; --pri-l:#eaf0ff; --bg:#f4f6fb; --card:#fff; --line:#e3e8f1; --line2:#eef1f7;
  --tx:#1c2333; --tx2:#5b6578; --tx3:#98a1b3;
  --c-run:#3b82f6; --c-late:#ef4444; --c-done:#22a06b; --c-plan:#94a3b8;
  --c-run-l:#e8f1ff; --c-late-l:#fdeceb; --c-done-l:#e5f6ee; --c-plan-l:#eef1f5;
  --rowh:34px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Pretendard','Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;color:var(--tx);background:var(--bg);display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* sidebar */
#side{width:196px;background:var(--side);border-right:1px solid var(--line);color:var(--tx2);display:flex;flex-direction:column;flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:20px 16px 18px}
.brand .lg{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.brand b{display:block;color:var(--tx);font-size:14px}.brand span{font-size:11px;color:var(--tx3)}
nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--tx2);text-decoration:none;cursor:pointer;font-weight:500}
nav a:hover{background:var(--soft2);color:var(--tx)}
nav a.on{background:var(--pri-l);color:var(--pri);font-weight:700}
nav a.dis{opacity:.45;cursor:default}
nav a .ic{width:16px;text-align:center}
.side-bot{margin-top:auto;padding:12px}
.me{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.me i{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.me b{display:block;color:var(--tx);font-size:12px}.me span{font-size:10.5px;color:var(--tx3)}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;padding:18px 22px 14px;gap:12px}
.ph{display:flex;align-items:flex-end;justify-content:space-between}
.ph small{color:var(--tx3);font-size:11.5px}
.ph h1{margin:2px 0 0;font-size:22px;letter-spacing:-.3px}
.ph .r{display:flex;gap:8px;align-items:center}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:15px}
.ibtn:hover{border-color:var(--pri);color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
/* filters */
.fbar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;color:var(--tx3);font-weight:600}
.fld input,.fld select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:var(--card);min-width:0}
.fld input:focus,.fld select:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
.fld.date input{width:128px}.fld.w1 input,.fld.w1 select{width:120px}.fld.w2 input{width:170px}
.chips{display:flex;gap:6px}
.chip{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx2);font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.lnk{background:none;border:0;color:var(--tx3);text-decoration:underline;height:32px}
.seg{display:inline-flex;background:var(--soft2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(20,30,60,.12)}
/* status cards */
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sc{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;border-top:3px solid var(--line)}
.sc small{color:var(--tx2);font-weight:600}.sc b{display:block;font-size:22px;margin:2px 0 0}.sc b em{font-style:normal;font-size:12px;color:var(--tx3);margin-left:3px;font-weight:500}
.sc.on{box-shadow:0 0 0 2px var(--pri-l);border-color:var(--pri)}
.sc.all{border-top-color:#334}.sc.run{border-top-color:var(--c-run)}.sc.late{border-top-color:var(--c-late)}.sc.done{border-top-color:var(--c-done)}.sc.plan{border-top-color:var(--c-plan)}
.sc.late b{color:var(--c-late)}
/* area */
.area{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;overflow:hidden}
.area-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line2)}
.area-h h3{margin:0;font-size:15px}.area-h h3 small{font-weight:500;color:var(--tx3);margin-left:8px;font-size:11.5px}
.area-b{flex:1;min-height:0;position:relative}
/* gantt */
.gv{position:absolute;inset:0;overflow:auto;background:var(--card)}
.gv-in{position:relative}
.gh{position:sticky;top:0;z-index:6;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.gh .l{position:sticky;left:0;z-index:7;background:var(--soft);border-right:1px solid var(--line);display:grid;align-items:end;padding:0 10px 6px;color:var(--tx3);font-size:11px;font-weight:600;height:48px}
.gh .r{position:relative;height:48px}
.gh .m{position:absolute;top:0;height:24px;border-left:1px solid var(--line);padding:5px 6px;font-size:11px;font-weight:700;color:var(--tx2);white-space:nowrap;overflow:hidden}
.gh .d{position:absolute;top:24px;height:24px;border-left:1px solid var(--line2);font-size:10px;color:var(--tx3);text-align:center;line-height:24px;overflow:hidden;white-space:nowrap}
.gh .d.we{color:#d86a6a}.gh .d.td{background:var(--c-late);color:#fff;font-weight:700;border-radius:4px}
.ov{position:absolute;top:48px;bottom:0;pointer-events:none;z-index:0}
.ov .tl{position:absolute;top:0;bottom:0;width:2px;background:var(--c-late);opacity:.75}
.gb{position:relative}
.depsvg{position:absolute;top:48px;pointer-events:none;z-index:3;overflow:visible}
.addsub{display:none;margin-left:6px;cursor:pointer;color:var(--pri);font-weight:800;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card);font-size:12px}
.gr:hover .addsub{display:inline-block}.addsub:hover{background:var(--pri);color:#fff}
.dpi{color:var(--tx3)}.shf{font-style:normal;font-size:10.5px;font-weight:700;color:#d12f2f;background:#fdeceb;border-radius:4px;padding:0 4px;margin-left:4px}
.gr{position:absolute;left:0;display:flex;border-bottom:1px solid var(--line2)}
.gr .l{position:sticky;left:0;z-index:3;background:var(--card);border-right:1px solid var(--line);display:grid;align-items:center;gap:6px;padding:0 10px;height:100%}
.gr:hover .l{background:var(--hov)}
.gr.sel .l{background:var(--pri-l)}
.gr .l .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gr .l .t em{font-style:normal;color:var(--tx3);font-size:11px;margin-right:6px}
.gr .ln{position:relative;overflow:hidden;height:100%}
.gr.grp .l{background:var(--soft);font-weight:700;cursor:pointer}
.gr.grp .l .t{color:var(--tx)}
.gr.grp:hover .l{background:var(--pri-l)}
.cols-n .l{grid-template-columns:minmax(0,1fr) 66px 50px 84px 52px}
.cols-c .l{grid-template-columns:minmax(0,1fr) 52px}
.cols-c .x{display:none}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-align:center;white-space:nowrap}
.pill.run{background:var(--c-run-l);color:#2563c9}.pill.late{background:var(--c-late-l);color:#d12f2f}.pill.done{background:var(--c-done-l);color:#168356}.pill.plan{background:var(--c-plan-l);color:#667}
.stg{font-size:11px;color:var(--tx2);text-align:center}
.pg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}
.pg i{flex:1;height:5px;background:#e8ecf4;border-radius:3px;overflow:hidden}.pg i b{display:block;height:100%;background:var(--c-run);border-radius:3px}
.pg.late i b{background:var(--c-late)}.pg.done i b{background:var(--c-done)}
.bar{position:absolute;top:7px;height:18px;border-radius:5px;font-weight:600;font-size:10.5px;color:#fff;padding:0 6px;line-height:18px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2;font-style:normal}
.bar u{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.18);text-decoration:none}
.bar span{position:relative}
.bar.run{background:var(--c-run)}.bar.late{background:var(--c-late)}.bar.done{background:var(--c-done)}.bar.plan{background:var(--c-plan)}
.pln{position:absolute;top:27px;height:3px;border-radius:2px;background:#c4cce0;z-index:1}
.dly{position:absolute;top:7px;height:18px;border-radius:0 5px 5px 0;background:repeating-linear-gradient(45deg,#f6b8b8 0 4px,#fde3e3 4px 8px);z-index:1}
.gbar{position:absolute;top:11px;height:8px;border-radius:4px;background:#b5c4ee}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3)}
/* kanban */
.kb{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:12px;overflow:auto;background:var(--soft)}
.kc{display:flex;flex-direction:column;min-height:0;background:var(--soft2);border-radius:12px;border-top:3px solid var(--line)}
.kc.run{border-top-color:var(--c-run)}.kc.late{border-top-color:var(--c-late)}.kc.done{border-top-color:var(--c-done)}.kc.plan{border-top-color:var(--c-plan)}
.kc h4{margin:0;padding:10px 12px;display:flex;justify-content:space-between;font-size:13px}.kc h4 span{color:var(--tx3);font-weight:600}
.kc .ls{overflow:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.kc.over{background:#e3ebff}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:grab}
.kcard:hover{border-color:var(--pri)}
.kcard .tp{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3);margin-bottom:4px}
.kcard b{display:block;font-size:12.5px;margin-bottom:6px;line-height:1.35}
.kcard .mt{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-top:6px}
.more{text-align:center;color:var(--tx3);font-size:11px;padding:4px}
/* calendar */
.cal{position:absolute;inset:0;overflow:auto;background:var(--card);display:flex;flex-direction:column}
.cal-h{display:flex;align-items:center;gap:8px;padding:10px 14px}
.cal-h b{font-size:16px;min-width:110px}
.cal-dow,.cal-wk .dn{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow div{padding:6px 8px;color:var(--tx3);font-size:11px;font-weight:700;border-bottom:1px solid var(--line)}
.cal-dow div:first-child,.cal-wk .dn div:first-child{color:#d86a6a}.cal-dow div:last-child{color:#5a7bd6}
.cal-wk{position:relative;flex:1;min-height:104px;border-bottom:1px solid var(--line2)}
.cal-wk .dn div{padding:4px 8px;font-size:11px;color:var(--tx2);border-right:1px solid var(--line2);height:100%;position:absolute;top:0;bottom:0;width:calc(100%/7)}
.cal-wk .dn div.o{color:#c7ccd8;background:#fafbfd}.cal-wk .dn div.t b{background:var(--c-late);color:#fff;border-radius:10px;padding:1px 6px}
.cb{position:absolute;height:17px;border-radius:4px;font-size:10.5px;font-weight:600;color:#fff;padding:0 5px;line-height:17px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2}
.cb.run{background:var(--c-run)}.cb.late{background:var(--c-late)}.cb.done{background:#6fbf9a}.cb.plan{background:var(--c-plan)}
.cm{position:absolute;font-size:10.5px;color:var(--tx3);z-index:2}
/* planner */
.pn-l{grid-template-columns:minmax(0,1fr) 50px}
.pn-l .l{grid-template-columns:minmax(0,1fr) 54px}
/* pages */
.pgs{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{padding:14px 16px}.kpi small{color:var(--tx2);font-weight:600}.kpi b{display:block;font-size:26px;margin:4px 0 2px}.kpi b em{font-style:normal;font-size:13px;color:var(--tx3);margin-left:3px}.kpi span{font-size:11px;color:var(--tx3)}
.kpi.warn{background:#fff8ef;border-color:#f3d9b4}.kpi.warn b{color:#d9730d}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:10px 18px;border:1px solid var(--line);background:var(--card);border-radius:10px;text-align:left;min-width:120px}
.tab b{display:block;font-size:14px}.tab small{color:var(--tx3)}
.tab.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.banner{display:flex;gap:10px;align-items:center;padding:9px 14px;background:#fff4f3;border:1px solid #f6cfcb;border-radius:10px;color:#b1342a;font-size:12.5px}
.pg3{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pc{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.pc:hover{border-color:var(--pri);box-shadow:0 4px 14px rgba(47,91,217,.1)}
.pc .tp{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--tx3)}
.pc h4{margin:0;font-size:15px;line-height:1.3}
.pc .big{display:flex;align-items:center;gap:10px}.pc .big i{flex:1;height:7px;border-radius:4px;background:#e8ecf4;overflow:hidden}.pc .big i b{display:block;height:100%;background:var(--pri)}.pc .big strong{font-size:18px;color:var(--pri)}
.stp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.stp div{text-align:center;font-size:10.5px;color:var(--tx3);padding:5px 2px;border-radius:6px;background:#f3f5fa}
.stp div b{display:block;font-size:13px;color:var(--tx2)}
.stp div.on{background:var(--pri);color:#cfdcff}.stp div.on b{color:#fff}
.stp div.pass{background:var(--pri-l);color:#6f8ae0}.stp div.pass b{color:var(--pri)}
.subs{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.subs div{display:grid;grid-template-columns:minmax(0,1fr) 78px 34px;gap:8px;align-items:center;font-size:11.5px}
.subs div span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ft{display:flex;gap:10px;font-size:11px;color:var(--tx2)}.ft .r{color:var(--c-late);font-weight:700}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.cp{padding:14px 16px}.cp h3{margin:0 0 10px;font-size:14px}
svg text{font-family:inherit}
/* entry */
.cochips{display:flex;flex-wrap:wrap;gap:6px}.cochip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600}
.cochip small{color:var(--tx3);font-weight:500}.cochip a{cursor:pointer;color:var(--tx3)}.cochip a:hover{color:var(--c-late)}
.anw{position:relative;flex:1;min-height:420px;overflow:hidden;padding:0}.anmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--tx2,#667);font-size:13px;line-height:1.7;padding:24px;z-index:0}.anf{position:absolute;z-index:1;inset:0;width:100%;height:100%;border:0;background:#fff}
.entry{display:grid;grid-template-columns:420px 1fr;gap:12px;align-items:start}
.form{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form .fld input,.form .fld select{width:100%}
.pbtn{height:36px;border:0;border-radius:9px;background:var(--pri);color:#fff;font-weight:700;padding:0 18px}
.pbtn.sub{background:var(--card);color:var(--tx2);border:1px solid var(--line)}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{text-align:left;padding:7px 8px;color:var(--tx3);font-size:11px;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--line2)}
.cont{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line2);font-size:12px}
.cont span{flex:1;min-width:0}.cont span em{display:block;font-style:normal;color:var(--tx3);font-size:10.5px}
.sm{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600}
.sm:hover{border-color:var(--pri);color:var(--pri)}
/* overlays */
#drawer{position:fixed;top:0;right:0;bottom:0;width:360px;background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,30,60,.1);z-index:40;transform:translateX(105%);transition:.2s;padding:20px;overflow:auto}
#drawer.on{transform:none}
#drawer h2{margin:8px 0 14px;font-size:17px;line-height:1.35}
#drawer dl{display:grid;grid-template-columns:84px 1fr;gap:8px 10px;margin:0 0 16px;font-size:12.5px}#drawer dt{color:var(--tx3)}#drawer dd{margin:0}
.x-close{position:absolute;top:12px;right:14px;border:0;background:none;font-size:20px;color:var(--tx3)}
#ctx{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.18);padding:5px;min-width:190px;display:none}
#ctx div{padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12.5px}
#ctx div:hover{background:var(--pri-l);color:var(--pri)}#ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
#ctx .hd{font-size:10.5px;color:var(--tx3);cursor:default;padding:4px 11px}#ctx .hd:hover{background:none;color:var(--tx3)}
#tip{position:fixed;z-index:70;background:#1c2333;color:#fff;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;pointer-events:none;display:none;max-width:300px}
#tip b{display:block;margin-bottom:2px}
#modal{position:fixed;inset:0;background:rgba(15,27,61,.35);z-index:50;display:none;place-items:center}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:14px;width:680px;max-width:94vw;max-height:88vh;overflow:auto;padding:22px 24px}
#modal h2{margin:0 0 4px}#modal .sub{color:var(--tx3);margin:0 0 14px;font-size:12px}
#modal h4{margin:16px 0 8px}
#modal select,#modal input{height:30px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--card)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2333;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;display:none}
.hint{font-size:11px;color:var(--tx3)}

:root[data-theme=dark]{--bg:#0e1424;--card:#171f33;--line:#2a3550;--line2:#222b43;--tx:#e6eaf5;--tx2:#a9b3cc;--tx3:#6f7b99;--soft:#1b2540;--soft2:#222d4a;--hov:#1e2a49;--side:#121a2e;--pri:#5b86ff;--pri-l:#22305a;
  --c-run-l:#1d3358;--c-late-l:#4a2326;--c-done-l:#1b3d31;--c-plan-l:#2a3350}
:root[data-theme=dark] .gr .l,:root[data-theme=dark] .gh,:root[data-theme=dark] .gv,:root[data-theme=dark] .cal,:root[data-theme=dark] .kb{background:var(--card)}
:root[data-theme=dark] .kb{background:var(--bg)}
:root[data-theme=dark] .kc{background:var(--soft)}
:root[data-theme=dark] .pill.run{color:#8fb4ff}:root[data-theme=dark] .pill.late{color:#ff8e8e}:root[data-theme=dark] .pill.done{color:#6fdca9}
:root[data-theme=dark] .pln{background:#3b4768}
:root[data-theme=dark] .fld input,:root[data-theme=dark] .fld select,:root[data-theme=dark] #modal select,:root[data-theme=dark] #modal input{color-scheme:dark}

#loading{position:fixed;inset:0;z-index:95;background:rgba(244,246,251,.85);display:none;place-items:center;font-weight:700;color:var(--pri)}
#loading.on{display:grid}

.gh .l,.gr .l{width:var(--L)}

@@LT@@/script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1E38; --ink-2:#16294a; --navy:#234A84; --navy-soft:#EAF2FF;
  --bg:#EEF1F6; --surface:#FFFFFF; --line:#E6EAF1; --line-strong:#D6DDE8;
  --t1:#182338; --t2:#5A6478; --t3:#94A0B3;
  --amber:#E8833A; --amber-soft:#FCEEE2; --red:#D64550; --red-soft:#FBE9EA;
  --green:#2AA36B; --green-soft:#E7F6EE;
  --shadow:0 1px 2px rgba(15,30,56,.04), 0 4px 16px rgba(15,30,56,.06);
  --shadow-lg:0 8px 30px rgba(15,30,56,.10); --r:14px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:13px;-webkit-font-smoothing:antialiased}
.num{font-family:'Inter','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:none;margin:0 auto;padding:22px clamp(16px,2vw,36px) 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top .title h1{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.top .title p{font-size:12.5px;color:var(--t2);margin-top:3px}
.top .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--navy)}
.top .brand .mk{width:22px;height:22px;background:linear-gradient(135deg,var(--navy),#3a6bb5);border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;transform:rotate(45deg)}
.top .brand .mk span{transform:rotate(-45deg)}
.databadge{font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:3px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.databadge i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}

.kpi-band{background:linear-gradient(160deg,var(--ink),var(--ink-2));border-radius:var(--r);padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px;box-shadow:var(--shadow-lg)}
.kpi{padding:15px 16px 12px;border-radius:10px;position:relative;overflow:hidden;transition:background .18s}
.kpi:hover{background:rgba(255,255,255,.04)}
.kpi__label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#9DB0CE;font-weight:600}
.kpi__label .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.kpi__val{font-size:27px;font-weight:800;color:#fff;margin-top:7px;letter-spacing:-.5px}
.kpi__val small{font-size:14px;font-weight:600;color:#9DB0CE;margin-left:3px}
.kpi + .kpi{border-left:1px solid rgba(255,255,255,.06)}

.subtabs{display:flex;gap:4px;margin-bottom:16px}
.subtab{background:var(--surface);border:1px solid var(--line);color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:10px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.subtab:hover{border-color:var(--line-strong);color:var(--t1)}
.subtab.on{background:var(--ink);border-color:var(--ink);color:#fff}

.slicers{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:flex;gap:18px;flex-wrap:nowrap;align-items:flex-end;margin-bottom:16px;box-shadow:var(--shadow)}
.sl{display:flex;flex-direction:column;gap:6px}
.sl__lb{font-size:10.5px;font-weight:700;color:var(--t3);letter-spacing:.6px;text-transform:uppercase}
.sl__chips{display:flex;gap:5px;flex-wrap:nowrap}
.sl__range{display:flex;gap:5px;align-items:center}
.sl .sl__range select{min-width:0;padding:7px 6px}
.sl__range .tilde{color:var(--t3);font-weight:700}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:#fff;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--t2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.cls-note{font-size:11.5px;color:var(--t2);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cls-note b{color:var(--t1)} .cls-note .warn{color:var(--red);font-weight:600}
@media(max-width:1280px){.slicers{flex-wrap:wrap}}
.ch{border:1px solid var(--line-strong);background:#fff;color:var(--t2);border-radius:15px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .13s;font-weight:500}
.ch:hover{border-color:var(--navy);color:var(--navy)}
.ch.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sl select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--t1);min-width:130px;cursor:pointer}
.sl select:focus{outline:none;border-color:var(--navy)}
.sl-reset{margin-left:auto;white-space:nowrap;align-self:center;border:1px solid var(--line-strong);background:#fff;color:var(--t2);border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s}
.sl-reset:hover{background:var(--bg);color:var(--t1)}

.xf{background:linear-gradient(90deg,var(--navy),#2d5896);color:#fff;border-radius:10px;font-size:12.5px;padding:9px 16px;display:none;align-items:center;justify-content:space-between;margin-bottom:14px;box-shadow:var(--shadow)}
.xf.show{display:flex}
.xf b{font-weight:700}
.xf .path{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.xf .path span{opacity:.6}
.xf button{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11.5px;cursor:pointer;font-family:inherit;font-weight:600}
.xf button:hover{background:rgba(255,255,255,.28)}

.screen{display:none} .screen.on{display:grid;gap:16px}
.row{display:grid;gap:16px} .row-2{grid-template-columns:1fr 1fr} .row-scatter{grid-template-columns:2.4fr 1fr}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.panel__hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:3px}
.panel h3{font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.2px}
.panel .desc{font-size:11.5px;color:var(--t3);margin-bottom:12px;margin-top:2px}
.panel__tag{font-size:10.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);padding:3px 9px;border-radius:12px;white-space:nowrap;cursor:pointer}
.cw{position:relative;flex:1;min-height:250px} .cw.h300{min-height:300px} .cw.h340{min-height:340px} .cw.hs{min-height:clamp(500px,66vh,860px)}

.scatter-legend{display:flex;gap:14px;margin-top:10px;padding-top:11px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.scatter-legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2)}
.scatter-legend .lg i{width:10px;height:10px;border-radius:50%}
.scatter-legend .note{margin-left:auto;font-size:10.5px;color:var(--t3)}

.drill-mini{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 3px;flex-shrink:0}
.dm-btn{background:none;border:none;color:var(--navy);font-size:11px;line-height:1;padding:3px 5px;border-radius:4px;cursor:pointer;font-family:inherit}
.dm-btn:hover:not(:disabled){background:var(--navy-soft)}
.dm-btn:disabled{opacity:.3;cursor:not-allowed}
.dm-label{font-size:9.5px;font-weight:700;color:var(--t2);padding:0 2px;min-width:26px;text-align:center}

.decomp{display:flex;flex-direction:column}
.decomp .empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--t3);font-size:12px;line-height:1.7;padding:20px}
.decomp .empty .ic{font-size:26px;margin-bottom:8px;opacity:.4}

.person-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}

.hint{font-size:11px;color:var(--t3);text-align:center;padding:6px}
@media(max-width:900px){.kpi-band{grid-template-columns:repeat(2,1fr)} .row-2,.row-scatter{grid-template-columns:1fr!important}}

/* ===== 챗봇 FAB + 패널 ===== */
.chat-fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#3a6bb5);
  border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(35,74,132,.4);z-index:200;transition:transform .15s}
.chat-fab:hover{transform:scale(1.06)}
.chat-fab .badge{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid #fff}

.chat-panel{position:fixed;right:24px;bottom:92px;width:400px;max-height:70vh;background:var(--surface);border-radius:16px;
  box-shadow:0 16px 50px rgba(15,30,56,.25);display:none;flex-direction:column;z-index:200;overflow:hidden;border:1px solid var(--line)}
.chat-panel.open{display:flex}
.chat-hd{background:var(--ink);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
.chat-hd .ti{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.chat-hd .ti i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.chat-hd .actions{display:flex;gap:4px}
.chat-hd button{background:rgba(255,255,255,.12);border:none;color:#fff;width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:12px}
.chat-hd button:hover{background:rgba(255,255,255,.22)}

.chat-mode{font-size:10.5px;padding:6px 16px;background:var(--amber-soft);color:var(--amber);font-weight:700;display:flex;align-items:center;justify-content:space-between}
.chat-mode.live{background:var(--green-soft);color:var(--green)}
.chat-mode button{background:none;border:none;color:inherit;text-decoration:underline;font-size:10.5px;cursor:pointer;font-family:inherit;font-weight:700}

.chat-settings{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:none;flex-direction:column;gap:8px}
.chat-settings.open{display:flex}
.chat-settings label{font-size:10.5px;font-weight:700;color:var(--t2)}
.chat-settings input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:7px;font-size:11.5px;font-family:inherit}
.chat-settings .warn{font-size:10px;color:var(--t3);line-height:1.5}
.chat-settings .row{display:flex;gap:6px}
.chat-settings .row button{background:var(--navy);color:#fff;border:none;border-radius:7px;padding:0 12px;font-size:11px;font-weight:600;cursor:pointer}

.chat-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:88%;font-size:12.5px;line-height:1.55;border-radius:12px;padding:10px 13px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;color:var(--t1);box-shadow:var(--shadow)}
.msg.user{background:var(--navy);color:#fff;align-self:flex-end}
.msg .tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;margin-bottom:6px}
.msg .tag.demo{background:var(--amber-soft);color:var(--amber)}
.msg .tag.live{background:var(--green-soft);color:var(--green)}
.msg .cand{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:5px}
.msg .cand-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px}
.msg .cand-row b{color:var(--navy)}
.msg .cand-row span{color:var(--t3);font-size:10.5px}
.msg .rank{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--navy-soft);color:var(--navy);
  font-size:9.5px;font-weight:800;align-items:center;justify-content:center;margin-right:6px}
.msg .thinking{display:flex;gap:4px;padding:4px 0}
.msg .thinking span{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:blink 1.2s infinite}
.msg .thinking span:nth-child(2){animation-delay:.2s}
.msg .thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.tlheat{margin-top:14px;overflow-x:auto}
.heat{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:100%}
.heat th{font-weight:600;color:var(--t3);padding:3px 6px;text-align:center;white-space:nowrap}
.heat td{text-align:center;padding:6px 4px;border-radius:4px;min-width:38px;font-variant-numeric:tabular-nums}
.heat .hl{text-align:left;white-space:nowrap;padding-right:12px;font-weight:600;color:var(--t1)}
.heat .hl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.heat .tt{font-weight:700;background:var(--bg)}
.chat-inputrow{padding:11px 14px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--surface)}
.chat-inputrow input{flex:1;padding:9px 12px;border:1px solid var(--line-strong);border-radius:20px;font-size:12px;font-family:inherit}
.chat-inputrow input:focus{outline:none;border-color:var(--navy)}
.chat-inputrow button{background:var(--navy);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0}
.chat-inputrow button:hover{background:#1c3d6e}
.chat-suggest{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap;background:var(--surface)}
.chat-suggest button{font-size:10.5px;border:1px solid var(--line-strong);background:var(--bg);color:var(--t2);border-radius:12px;padding:5px 10px;cursor:pointer;font-family:inherit}
.chat-suggest button:hover{border-color:var(--navy);color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="title">
      <h1>기술연구소 업무 현황 분석 <span class="databadge" id="dataBadge"><i></i>업무관리 데이터</span></h1>
      <p>계획 편차율 · 지연편차시간 기반 업무 부하 진단 대시보드 <button class="ch" id="btnReload" style="margin-left:10px;display:none" onclick="reloadFromSheet(true)">↻ 새로고침</button> <span id="syncInfo" style="color:var(--t3);font-size:12px"></span></p>
    </div>
    <div class="brand"><span class="mk"><span>G</span></span> GST 기술연구소</div>
  </div>

  <div class="kpi-band">
    <div class="kpi"><div class="kpi__label"><span class="dot"></span>전체 업무 등록</div><div class="kpi__val num" id="kpiReg">-</div></div>
    <div class="kpi"><div class="kpi__label"><span class="dot"></span>전체 업무 완료</div><div class="kpi__val num" id="kpiDone">-</div></div>
    <div class="kpi"><div class="kpi__label"><span class="dot"></span>평균 지연율</div><div class="kpi__val num" id="kpiDelay">-</div></div>
    <div class="kpi"><div class="kpi__label"><span class="dot"></span>평균 계획 편차율</div><div class="kpi__val num" id="kpiDev">-</div></div>
    <div class="kpi"><div class="kpi__label"><span class="dot"></span>과중 인원 비율 <span style="color:#6b7db8;font-weight:500">(최근 4주)</span></div><div class="kpi__val num" id="kpiOver">-</div></div>
  </div>

  <div class="subtabs">
    <button class="subtab on" data-s="s1" onclick="switchScreen('s1',this)">부하 진단 (산점도)</button>
    <button class="subtab" data-s="s2" onclick="switchScreen('s2',this)">역량 · 업무 비중</button>
    <button class="subtab" data-s="s3" onclick="switchScreen('s3',this)">추이 · 타임라인</button>
  </div>

  <div class="slicers">
    <div class="sl"><span class="sl__lb">기간 (달력 월 기준)</span>
      <div class="sl__range"><select id="slFromY" onchange="onPeriodChange()"></select><select id="slFromM" onchange="onPeriodChange()"></select><span class="tilde">~</span><select id="slToY" onchange="onPeriodChange()"></select><select id="slToM" onchange="onPeriodChange()"></select><button class="ch" onclick="setPeriodAll()">전체 기간</button></div></div>
    <div class="sl"><span class="sl__lb">조직</span><select id="slOrg" onchange="onFilterChange()"><option value="">모두</option></select></div>
    <div class="sl"><span class="sl__lb">직급</span><div class="sl__chips" id="slGrade"></div></div>
    <div class="sl"><span class="sl__lb">업무 구분</span><select id="slCat" onchange="onFilterChange()"><option value="">모두</option></select></div>
    <button class="sl-reset" onclick="resetAll()">필터 초기화</button>
  </div>

  <div class="xf" id="xf">
    <div class="path" id="xfPath"></div>
    <button onclick="clearSelection()">선택 해제</button>
  </div>

  <div class="screen on" id="s1">
    <div class="row row-2">
      <div class="panel">
        <div class="panel__hd">
          <div><h3>평균 소요시간</h3><div class="desc">실제 소요시간 평균(h) · 레벨: <span id="avgDurLevelNote">조직</span></div></div>
          <div class="drill-mini">
            <button class="dm-btn" id="dmUp-avgDur" onclick="chLevel('avgDur',-1)" title="상위 레벨">▲</button>
            <span class="dm-label" id="dmLabel-avgDur">조직</span>
            <button class="dm-btn" id="dmDown-avgDur" onclick="chLevel('avgDur',1)" title="하위 레벨">▼</button>
          </div>
        </div>
        <div class="cw h300"><canvas id="cAvgDur"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel__hd">
          <div><h3>업무 구분별 비중 현황</h3><div class="desc">실제 소요시간 기준 · 전체 <span id="catCount">-</span>종 · 범례 클릭 토글</div></div>
          <div class="drill-mini">
            <button class="dm-btn" id="dmUp-catMix" onclick="chLevel('catMix',-1)" title="상위 레벨">▲</button>
            <span class="dm-label" id="dmLabel-catMix">조직</span>
            <button class="dm-btn" id="dmDown-catMix" onclick="chLevel('catMix',1)" title="하위 레벨">▼</button>
          </div>
        </div>
        <div class="cw h300"><canvas id="cCatMix"></canvas></div>
      </div>
    </div>
    <div class="row row-scatter">
      <div class="panel">
        <div class="panel__hd">
          <div><h3>계획편차율 · 지연편차시간 산점도 <span class="panel__tag" style="margin-left:6px">핵심 차트</span></h3>
          <div class="desc">원점(0,0)에 가까울수록 계획과 실행이 일치 · 점 클릭 시 선택(교차 필터) + 지연 분해 · ◆ 표시는 축 밖 이상값(실제값은 툴팁)</div></div>
          <div style="display:flex;gap:10px;align-items:center">
          <div class="seg" title="축 범위"><button id="scFitAuto" class="on" onclick="setScatterFit('auto')">축 자동 맞춤</button><button id="scFitFull" onclick="setScatterFit('full')">전체 범위</button></div>
          <div class="drill-mini">
            <button class="dm-btn" id="dmUp-scatter" onclick="chLevel('scatter',-1)" title="상위 레벨">▲</button>
            <span class="dm-label" id="dmLabel-scatter">조직</span>
            <button class="dm-btn" id="dmDown-scatter" onclick="chLevel('scatter',1)" title="하위 레벨">▼</button>
          </div></div>
        </div>
        <div class="cw hs"><canvas id="cScatter"></canvas></div>
        <div class="scatter-legend">
          <div class="lg"><i style="background:#D64550"></i>과중 (실제공수 &gt; 기준공수)</div>
          <div class="lg"><i style="background:#E8833A"></i>적정 (기준공수의 90~100%)</div>
          <div class="lg"><i style="background:#2AA36B"></i>여유 (기준공수의 90% 미만)</div>
          <span class="note" id="scatterLevelNote">레벨: 조직</span>
        </div>
      </div>
      <div class="panel decomp">
        <div class="panel__hd"><div><h3>지연 원인 분해</h3><div class="desc">착수 지연 vs 실행 중 지연 (실제 합계)</div></div></div>
        <div class="cw" id="decompWrap" style="display:none"><canvas id="cDecomp"></canvas></div>
        <div class="empty" id="decompEmpty">
          <div><div class="ic">◎</div>산점도에서 점을 클릭하면<br>해당 그룹의 지연이<br><b>착수 문제</b>인지 <b>실행 문제</b>인지<br>실제 데이터로 분해해서 보여줍니다</div>
        </div>
      </div>
    </div>

    <div class="panel" id="focusRadarPanel" style="display:none">
      <div class="panel__hd">
        <div><h3>집중도 프로파일 — <span id="focusPersonName"></span></h3>
        <div class="desc">전체평균 · 소속팀평균 · 개인평균 소요시간(업무 1건당, h) — 업무 구분별 비교 · 담당자 드릴다운 시에만 표시</div></div>
        <span class="panel__tag" style="background:var(--amber-soft);color:var(--amber);cursor:default">드릴스루</span>
      </div>
      <div class="cw h340"><canvas id="cFocusRadar"></canvas></div>
    </div>
  </div>

  <div class="screen" id="s2">
    <div class="row row-2">
      <div class="panel">
        <div class="panel__hd"><div><h3>담당자별 역량</h3><div class="desc">미지연율 · 공수절감율 · 적기착수율 · 기한단축률 · 업무수행량(상대값) — 담당자 최대 4명 선택</div></div></div>
        <div class="person-picker" id="personPicker"></div>
        <div class="cw h340"><canvas id="cRadarPerson"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel__hd"><div><h3>업무 대분류 비중 (실제 소요시간 기준)</h3><div class="desc">핵심 연구 업무 vs 지원 업무 · 조직별</div></div></div>
        <div class="cw h340"><canvas id="cStacked"></canvas></div>
        <div class="cls-note" id="clsNote"></div>
      </div>
    </div>
  </div>

  <div class="screen" id="s3">
    <div class="panel">
      <div class="panel__hd"><div><h3>업무 타임라인</h3><div class="desc" id="tlDesc">월별 업무 건수(막대) · 평균 실제 소요일(선)</div></div>
        <div class="seg"><button id="tlAll" class="on" onclick="setTimelineMode('all')">전체</button><button id="tlOrg" onclick="setTimelineMode('org')">조직별</button></div></div>
      <div class="cw h300"><canvas id="cTimeline"></canvas></div>
      <div id="tlHeat" class="tlheat" style="display:none"></div>
    </div>
    <div class="panel">
      <div class="panel__hd"><div><h3>핵심 업무 비중 추이</h3><div class="desc">월별 핵심 연구 업무 비중(실제 소요시간 기준) 변화</div></div></div>
      <div class="cw"><canvas id="cCoreTrend"></canvas></div>
    </div>
  </div>

  <div class="hint" id="dataNote">※ 업무관리 앱의 업무 기록(실제 시작일·완료일 기준)을 그대로 집계합니다. 업무를 등록·완료하면 이 화면을 다시 열 때 반영됩니다.</div>
</div>

@@LT@@script>
/* ================= 실데이터 (더미, 1,020행) ================= */
/* ================= 구글 시트 연동 설정 =================
 * SHEET_API_URL : Apps Script 웹앱 배포 URL (…/exec). 비워두면 아래 내장 데모 데이터 사용
 * TOKEN         : Apps Script 스크립트 속성 TOKEN 과 같은 값 (비워도 됨)
 * AUTO_REFRESH_MIN : 0 이면 자동 갱신 없음, 숫자면 N분마다 다시 읽기 */
const CONFIG = {
  SHEET_API_URL: "https://script.google.com/macros/s/AKfycbz5vKo4LGcyKyUiqks-L11pn0fS0LpPuQtan5Synkb_wqt8s3C9bW-OeW9qK1WldIiW/exec", TOKEN: "", AUTO_REFRESH_MIN: 0,
  /* '업무 구분' 중 핵심 연구 업무로 분류할 항목 (나머지는 전부 지원 업무). 실제 기준에 맞게 수정하세요 */
  CORE_CATS: ["개발","개발 기획","Test","설계 변경","표준·기술 문서","표준,기술 문서"],
  /* 기간 슬라이서 적용 방식 — overlap: 실제 시작~완료 기간이 선택 기간과 겹치는 업무(겹친 일수만큼 공수 비례 배분, Power BI 방식)
     completion: 실제 완료일이 선택 기간 안인 업무만 */
  DATE_MODE: "overlap"
};

let RAW = (window.__GST && window.__GST.raw) || [];

/* ================= 상태 ================= */
let state = { from:null, to:null, org:"", grade:null, cat:"" };
let scatterFit = "auto";   // auto: 축 자동 맞춤 / full: 전체 범위

let levels = { scatter:'org', avgDur:'org', catMix:'org' }; // 차트별 독립 드릴 레벨
let selectedEntity = null;       // {level, value} — 산점도 점 클릭 시 선택(크로스필터 + 분해/포커스용)

let charts = {};

/* ================= 필터링 =================
 * baseFilteredRows: 슬라이서(월/조직/직급/업무구분)만 적용 — 산점도 자체의 그룹핑에 사용
 * filteredRows: 위에 selectedEntity(점 선택) 교차 필터까지 적용 — KPI/레이더/비중/타임라인에 사용
 */
const F = r => (r._f===undefined ? 1 : r._f);   // 선택 기간과 겹친 비율(공수 비례 배분용)
function dayNum(str){ const [y,m,d]=String(str).slice(0,10).split('-').map(Number); return Date.UTC(y,m-1,d)/86400000; }
function periodBounds(){
  const [fy,fm]=state.from.split('-').map(Number), [ty,tm]=state.to.split('-').map(Number);
  return [Date.UTC(fy,fm-1,1)/86400000, Date.UTC(ty,tm,0)/86400000];
}
let _span=null;
function periodCoversAll(){
  if(!_span){ const ds=dataDates(); _span = ds.length? [ds[0].slice(0,7), ds[ds.length-1].slice(0,7)] : ["",""]; }
  return state.from<=_span[0] && state.to>=_span[1];
}
/** 선택 기간과 겹친 비율. 0 이면 기간 밖(제외) */
function rowFraction(r){
  const [ps,pe]=periodBounds();
  if(CONFIG.DATE_MODE==='completion'){
    if(!r.ae) return periodCoversAll() ? 1 : 0; const e=dayNum(r.ae); return (e>=ps && e<=pe)?1:0;
  }
  const sRaw=r.as||r.ae, eRaw=r.ae||r.as;
  if(!sRaw) return periodCoversAll() ? 1 : 0;   // 날짜가 전혀 없는(미착수) 업무는 '전체 기간' 조회일 때만 포함
  let s=dayNum(sRaw), e=dayNum(eRaw); if(e<s) e=s;
  const ov=Math.min(e,pe)-Math.max(s,ps)+1;
  return ov<=0 ? 0 : ov/(e-s+1);
}
function baseFilteredRows(){
  return RAW.filter(r=>{
    r._f = rowFraction(r); if(r._f<=0) return false;
    if(state.org && r.o!==state.org) return false;
    if(state.grade && r.g!==state.grade) return false;
    if(state.cat && r.c!==state.cat) return false;
    return true;
  });
}
function filteredRows(){
  const base = baseFilteredRows();
  if(!selectedEntity) return base;
  const key = groupKeyFor(selectedEntity.level);
  return base.filter(r=> r[key]===selectedEntity.value);
}

/* ================= 집계 함수 (사양서 3장 로직) ================= */
function sum(arr,f){ return arr.reduce((s,r)=>s+(f(r)||0),0); }
function cnt(arr,f){ return arr.filter(f).length; }

/* ================= 헤드카운트 참조 테이블 (사양서 1-2/1-3 '팀별 인원'/'직급별 인원' 대응) =================
 * 더미 데이터는 담당자당 조직·직급이 생성 시점에 고정되어 있으므로,
 * RAW 전체(필터 무관)에서 고유 (조직,담당자) / (조직,직급,담당자) 조합을 뽑으면
 * 실제 인사 테이블과 동일한 역할을 하는 헤드카운트를 만들 수 있음 */
const ORG_HEADCOUNT = {};
const ORG_GRADE_HEADCOUNT = {};
let HEADCOUNT_SRC = (window.__GST && window.__GST.headG && window.__GST.headG.length) ? window.__GST.headG : null;
let HEADCOUNT_ORG_SRC = (window.__GST && window.__GST.headT && window.__GST.headT.length) ? window.__GST.headT : null; // 시트의 '팀별 인원' 탭 [{o,n}] — 조직 단위 인원수는 이것 우선 // 시트의 '인원수' 탭 [{o,g,n}] — 있으면 이것을 우선 사용
function rebuildHeadcount(){
  Object.keys(ORG_HEADCOUNT).forEach(k=>delete ORG_HEADCOUNT[k]);
  Object.keys(ORG_GRADE_HEADCOUNT).forEach(k=>delete ORG_GRADE_HEADCOUNT[k]);
  if(HEADCOUNT_SRC && HEADCOUNT_SRC.length){
    HEADCOUNT_SRC.forEach(h=>{
      ORG_HEADCOUNT[h.o] = (ORG_HEADCOUNT[h.o]||0)+h.n;
      const gk = h.o+"_"+h.g;
      ORG_GRADE_HEADCOUNT[gk] = (ORG_GRADE_HEADCOUNT[gk]||0)+h.n;
    });
  } else {
    const seen = new Set();
    RAW.forEach(r=>{
      const key = r.o+"|"+r.p;
      if(!seen.has(key)){
        seen.add(key);
        ORG_HEADCOUNT[r.o] = (ORG_HEADCOUNT[r.o]||0)+1;
        const gk = r.o+"_"+r.g;
        ORG_GRADE_HEADCOUNT[gk] = (ORG_GRADE_HEADCOUNT[gk]||0)+1;
      }
    });
  }
  if(HEADCOUNT_ORG_SRC && HEADCOUNT_ORG_SRC.length){
    Object.keys(ORG_HEADCOUNT).forEach(k=>delete ORG_HEADCOUNT[k]);
    HEADCOUNT_ORG_SRC.forEach(h=>{ ORG_HEADCOUNT[h.o]=(ORG_HEADCOUNT[h.o]||0)+h.n; });
  }
  TOTAL_HEADCOUNT = Object.values(ORG_HEADCOUNT).reduce((a,b)=>a+b,0);
}
let TOTAL_HEADCOUNT = 0;
rebuildHeadcount();

/** 인원수기준 — DAX: IF(ISFILTERED(담당자),1, IF(ISFILTERED(직급),직급별인원SUM, 조직별인원LOOKUPVALUE합)) */
function 인원수기준(level, groupRows, groupValue){
  if(level==='person') return 1;
  if(level==='grade'){
    const orgsInGroup = new Set(groupRows.map(r=>r.o));
    let s=0; orgsInGroup.forEach(o=> s += (ORG_GRADE_HEADCOUNT[o+'_'+groupValue]||0));
    return s || 1;
  }
  if(level==='org') return ORG_HEADCOUNT[groupValue] || 1;
  return TOTAL_HEADCOUNT || 1; // 레벨 컨텍스트 없이 전체 집계(KPI 등)
}

/* ================= 워킹데이 (사양서 3-2: 선택 기간 전체의 평일 수) ================= */
function isBiz(d){ const w=d.getDay(); return w>=1 && w<=5; }
function networkDays(start, end){
  let n=0; const d=new Date(start);
  while(d<=end){ if(isBiz(d)) n++; d.setDate(d.getDate()+1); }
  return n;
}
function currentWorkingDays(){
  const [fy,fm]=state.from.split('-').map(Number), [ty,tm]=state.to.split('-').map(Number);
  return Math.max(1, networkDays(new Date(fy,fm-1,1), new Date(ty,tm,0)));
}

function hasVal(v){ return v!==null && v!==undefined && v!==""; }

function aggregate(rows, workingDays, level, groupValue){
  const total = rows.length; // COUNT('대시보드데이터'[업무]) — 완료 여부와 무관한 전체 건수

  // SUM 계열: blank는 자연히 0 기여이므로, 값이 있는 행만 걸러 합산
  const edurRows = rows.filter(r=>hasVal(r.edur));
  const adurRows = rows.filter(r=>hasVal(r.adur));
  const edurSum = sum(edurRows, r=>r.edur*F(r));
  const adurSum = sum(adurRows, r=>r.adur*F(r));

  // 계획 편차율 = DIVIDE(SUM(실제소요시간), SUM(예상소요시간), 0) - 1
  const 계획편차율 = edurSum>0 ? (adurSum/edurSum - 1) : 0;
  // 공수 절감율 = DIVIDE(SUM(예상)-SUM(실제), SUM(예상), 0)
  const 공수절감율 = edurSum>0 ? (edurSum-adurSum)/edurSum : 0;

  // AVERAGE 계열은 DAX AVERAGE()와 동일하게 blank 제외 평균
  const devhRows = rows.filter(r=>hasVal(r.devh));
  const 평균지연편차시간 = devhRows.length ? sum(devhRows,r=>r.devh)/devhRows.length : 0;

  // 아래 4개는 전부 분모가 COUNT(업무) = total (완료 여부 무관)
  const 지연율 = total ? cnt(rows,r=>r.dcnt===1)/total : 0;
  const 미지연율 = total ? cnt(rows,r=>r.dcnt===0)/total : 0;
  const 착수지연율 = total ? cnt(rows,r=>r.sdcnt===1)/total : 0;
  const 적기착수율 = total ? cnt(rows,r=> hasVal(r.sdcnt) && (r.sdcnt===0 || r.sdelay<=3))/total : 0;
  const 기한단축률 = total ? cnt(rows,r=> hasVal(r.edur) && hasVal(r.adur) && r.edur>0 && (r.edur-r.adur)>0)/total : 0;

  // 인원수기준 — DAX: 담당자 필터시 1 / 직급 단위면 직급별 인원 SUM / 조직 단위면 팀별 인원 LOOKUPVALUE 합
  const 인원수 = 인원수기준(level, rows, groupValue);
  const 워킹데이 = workingDays || currentWorkingDays();
  const 기준공수 = 인원수 * 워킹데이 * 8;
  const 실제공수 = adurSum;

  return { total, doneRows: adurRows.length, 계획편차율, 평균지연편차시간, 지연율, 미지연율, 착수지연율, 적기착수율,
    기한단축률, 공수절감율, 인원수, 워킹데이, 기준공수, 실제공수, edurSum, adurSum };
}

function loadColor(real, base){
  if(base<=0) return "#2AA36B";
  if(real>base) return "#D64550";
  if(real>=base*0.9) return "#E8833A";
  return "#2AA36B";
}

/* ================= 슬라이서 초기화 ================= */
function initSlicers(){
  ["slGrade","personPicker"].forEach(id=>{document.getElementById(id).innerHTML="";});
  ["slOrg","slCat"].forEach(id=>{const el=document.getElementById(id); el.innerHTML='<option value="">모두</option>';});
  const orgs=[...new Set(RAW.map(r=>r.o))].sort();
  const grades=["사원","주임","대리","과장","차장","부장","상무"].filter(g=>RAW.some(r=>r.g===g));
  const cats=[...new Set(RAW.map(r=>r.c))].sort();

  initPeriodSelects();

  const gEl=document.getElementById("slGrade");
  grades.forEach(g=>{const b=document.createElement("button");b.className="ch";b.textContent=g;
    b.onclick=()=>{state.grade=state.grade===g?null:g;sync(gEl,state.grade);onFilterChange();};gEl.appendChild(b);});

  const oSel=document.getElementById("slOrg");
  orgs.forEach(o=>{const e=document.createElement("option");e.value=o;e.textContent=o;oSel.appendChild(e);});
  const cSel=document.getElementById("slCat");
  cats.forEach(c=>{const e=document.createElement("option");e.value=c;e.textContent=c;cSel.appendChild(e);});

  // 담당자 선택 칩 (역량 레이더용) - 업무건수 상위 12명 후보
  const personCount={};
  RAW.forEach(r=>{personCount[r.p]=(personCount[r.p]||0)+1;});
  const topPersons=Object.keys(personCount).sort((a,b)=>personCount[b]-personCount[a]).slice(0,12);
  selectedPersons=topPersons.slice(0,4);
  const pp=document.getElementById("personPicker");
  topPersons.forEach(p=>{
    const b=document.createElement("button");b.className="ch"+(selectedPersons.includes(p)?" on":"");b.textContent=p;
    b.onclick=()=>{
      if(selectedPersons.includes(p)) selectedPersons=selectedPersons.filter(x=>x!==p);
      else if(selectedPersons.length<4) selectedPersons.push(p);
      else return;
      sync(pp,null); [...pp.children].forEach(ch=>ch.classList.toggle("on",selectedPersons.includes(ch.textContent)));
      updateAll();
    };
    pp.appendChild(b);
  });
}
/* ---- 기간(달력 월) 슬라이서: 연도·월 선택으로 시작~종료 범위 지정 ---- */
function dataDates(){ return RAW.flatMap(r=>[r.as,r.ae]).filter(Boolean).sort(); }
function initPeriodSelects(){
  _span=null; const ds=dataDates();
  const minY=ds.length? +ds[0].slice(0,4) : new Date().getFullYear();
  const maxY=ds.length? +ds[ds.length-1].slice(0,4) : minY;
  if(!state.from || !state.to){
    state.from = maxY+"-01";
    state.to = ds.length ? ds[ds.length-1].slice(0,7) : maxY+"-12";   // 최신 연도 1월 ~ 데이터 마지막 월 (달력 기준)
  }
  ["slFromY","slToY"].forEach(id=>{ const el=document.getElementById(id); el.innerHTML="";
    for(let y=minY;y<=maxY;y++){ const o=document.createElement("option"); o.value=y; o.textContent=y+"년"; el.appendChild(o);} });
  ["slFromM","slToM"].forEach(id=>{ const el=document.getElementById(id); el.innerHTML="";
    for(let m=1;m<=12;m++){ const o=document.createElement("option"); o.value=m; o.textContent=m+"월"; el.appendChild(o);} });
  syncPeriodSelects();
}
function syncPeriodSelects(){
  const [fy,fm]=state.from.split('-'), [ty,tm]=state.to.split('-');
  document.getElementById("slFromY").value=+fy; document.getElementById("slFromM").value=+fm;
  document.getElementById("slToY").value=+ty;   document.getElementById("slToM").value=+tm;
}
function onPeriodChange(){
  const g=id=>+document.getElementById(id).value;
  let f=g("slFromY")*12+g("slFromM")-1, t=g("slToY")*12+g("slToM")-1;
  if(f>t) [f,t]=[t,f];
  const ym=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
  state.from=ym(f); state.to=ym(t);
  syncPeriodSelects(); clearSelection(false); updateAll();
}
function setPeriodAll(){
  const ds=dataDates(); if(!ds.length) return;
  state.from=ds[0].slice(0,7); state.to=ds[ds.length-1].slice(0,7);
  syncPeriodSelects(); clearSelection(false); updateAll();
}
function sync(box,active){[...box.children].forEach(ch=>ch.classList.toggle("on",ch.textContent===active));}

function onFilterChange(){
  state.org=document.getElementById("slOrg").value;
  state.cat=document.getElementById("slCat").value;
  clearSelection(false);
  updateAll();
}
function resetAll(){
  state={from:null,to:null,org:"",grade:null,cat:""}; initPeriodSelects();
  document.getElementById("slOrg").value=""; document.getElementById("slCat").value="";
  sync(document.getElementById("slGrade"),null);
  levels = { scatter:'org', avgDur:'org', catMix:'org' };
  clearSelection(false);
  updateDrillUI();
  updateAll();
}

/* ================= 드릴 레벨 전환 (차트별 독립, 버튼 기반 — Power BI 스타일) =================
 * 각 차트(산점도/평균소요시간/업무구분비중)는 서로 완전히 독립적인 레벨 상태를 가진다.
 * 한 차트의 레벨을 바꿔도 다른 차트는 영향받지 않는다.
 */
function chLevel(chartKey, delta){
  const i = LEVELS.indexOf(levels[chartKey]);
  const next = i + delta;
  if(next<0 || next>=LEVELS.length) return;
  levels[chartKey] = LEVELS[next];
  if(chartKey==='scatter') clearSelection(false); // 산점도 레벨이 바뀌면 그 선택은 더 이상 유효하지 않음
  updateDrillUI();
  if(chartKey==='scatter') updateScatter();
  else if(chartKey==='avgDur') updateAvgDuration();
  else if(chartKey==='catMix') updateCategoryMix();
  updateKpi(); // 선택 해제로 인한 KPI 변동 반영(scatter 레벨 변경 시)
}
function updateDrillUI(){
  ['scatter','avgDur','catMix'].forEach(k=>{
    document.getElementById("dmLabel-"+k).textContent = LEVEL_LABEL[levels[k]];
    document.getElementById("dmUp-"+k).disabled = (levels[k]==='org');
    document.getElementById("dmDown-"+k).disabled = (levels[k]==='person');
  });
}

/** 산점도의 점을 클릭했을 때 — 레벨은 바뀌지 않고, 해당 항목을 선택(교차 필터) + 분해/포커스 패널 갱신 */
function selectPoint(value){
  if(selectedEntity && selectedEntity.level===levels.scatter && selectedEntity.value===value){
    clearSelection(); // 같은 점 다시 클릭 → 선택 해제
    return;
  }
  selectedEntity = {level:levels.scatter, value};
  showDecompFor(levels.scatter, value);
  if(levels.scatter==='person') showFocusRadar(value); else hideFocusRadar();
  updateXfBanner();
  updateAll();
}
function clearSelection(refresh){
  selectedEntity = null;
  hideDecomp();
  hideFocusRadar();
  updateXfBanner();
  if(refresh!==false) updateAll();
}
function updateXfBanner(){
  const xf=document.getElementById("xf");
  if(!selectedEntity){ xf.classList.remove("show"); return; }
  xf.classList.add("show");
  document.getElementById("xfPath").innerHTML =
    `선택됨(${LEVEL_LABEL[selectedEntity.level]}): <b>${selectedEntity.value}</b> — 다른 차트가 이 항목 기준으로 교차 필터링됨`;
}

/* ================= Chart 공통 ================= */
Chart.defaults.font.family="'Noto Sans KR', 'Inter', sans-serif";
Chart.defaults.font.size=11; Chart.defaults.color="#5A6478";
const GRID="#EDF0F5";

const quadrantPlugin={id:"quad",beforeDraw(chart){
  const {ctx,chartArea:a,scales}=chart; if(!a) return;
  const x0=scales.x.getPixelForValue(0), y0=scales.y.getPixelForValue(0);
  ctx.save();
  ctx.font="600 10px 'Noto Sans KR'";ctx.fillStyle="#B8C1D0";
  ctx.textAlign="left";ctx.fillText("계획 > 실행",a.left+6,y0-6);
  ctx.textAlign="right";ctx.fillText("계획 < 실행",a.right-6,y0-6);
  ctx.textAlign="center";ctx.fillText("지연",x0,a.top+12);ctx.fillText("단축",x0,a.bottom-6);
  ctx.strokeStyle="#C7D0DE";ctx.lineWidth=1;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(x0,a.top);ctx.lineTo(x0,a.bottom);ctx.stroke();
  ctx.beginPath();ctx.moveTo(a.left,y0);ctx.lineTo(a.right,y0);ctx.stroke();
  ctx.restore();
}};
let scatterLabels=[];
const pointLabelPlugin={id:"plabel",afterDatasetsDraw(chart){
  const {ctx}=chart;const meta=chart.getDatasetMeta(0);
  ctx.save();ctx.font="600 10px 'Noto Sans KR'";ctx.fillStyle="#5A6478";ctx.textAlign="left";
  const right=chart.chartArea.right;

let ALL_CATS = [], CAT_COLORS = [];
const PALETTE = ["#234A84","#3F6BB0","#5B8FD6","#8AB4E8","#B8D3F5","#E8833A","#D64550","#8B5FBF","#2AA36B","#5BB98C","#B08900","#94A0B3","#C97BB8","#57B6A9",
  "#1F7A8C","#BF4E30","#6C757D","#A68A64","#4C6E91","#9BC53D","#FA7921","#5D576B","#E0B1CB","#2E4057"];
/** 데이터에 실제로 있는 '업무 구분'으로 범례·레이더 축을 구성 (핵심 업무 먼저, 나머지는 공수 큰 순) */
function computeCats(){
  const tot={};
  RAW.forEach(r=>{ if(r.c) tot[r.c]=(tot[r.c]||0)+(Number(r.adur)||0)+1e-4; });
  const core=CONFIG.CORE_CATS.filter(c=>tot[c]!==undefined);
  const rest=Object.keys(tot).filter(c=>!CORE_CATS.has(c)).sort((a,b)=>tot[b]-tot[a]);
  ALL_CATS=[...core,...rest];
  CAT_COLORS=ALL_CATS.map((_,i)=>PALETTE[i%PALETTE.length]);
  const el=document.getElementById("catCount"); if(el) el.textContent=ALL_CATS.length;
}

function groupKeyFor(level){ return level==='org'?'o':(level==='grade'?'g':'p'); }

/** 축 범위 계산 — 항상 0 포함, robust 이면 IQR 기준 이상값은 범위에서 제외(가장자리 표시) */
function fitAxis(vals, minSpan, robust){
  const v=vals.filter(Number.isFinite).sort((a,b)=>a-b);
  if(!v.length) return [-minSpan,minSpan];
  let lo=v[0], hi=v[v.length-1];
  if(robust && v.length>=5){
    const q=p=>{const i=(v.length-1)*p, f=Math.floor(i); return v[f]+(v[Math.min(f+1,v.length-1)]-v[f])*(i-f);};
    const q1=q(.25), q3=q(.75), iqr=Math.max(q3-q1,minSpan*0.5);
    lo=Math.max(lo,q1-2.2*iqr); hi=Math.min(hi,q3+2.2*iqr);
  }
  lo=Math.min(lo,0); hi=Math.max(hi,0);
  if(hi-lo<minSpan){ const c=(hi+lo)/2; lo=Math.min(lo,c-minSpan/2); hi=Math.max(hi,c+minSpan/2); }
  const pad=(hi-lo)*0.14, q=minSpan>=5?1:0.5;
  return [Math.floor((lo-pad)/q)*q, Math.ceil((hi+pad)/q)*q];
}

function updateScatter(){
  const base = baseFilteredRows();
  const wd = currentWorkingDays();
  const level = levels.scatter;
  document.getElementById("scatterLevelNote").textContent = "레벨: " + LEVEL_LABEL[level];
  const key = groupKeyFor(level);
  const groups = {};
  base.forEach(r=>{ (groups[r[key]] = groups[r[key]]||[]).push(r); });

  scatterLabels = Object.keys(groups);
  const pts = scatterLabels.map(k=>{
    const agg = aggregate(groups[k], wd, level, k);
    return {xRaw: agg.계획편차율*100, yRaw: agg.평균지연편차시간, n: groups[k].length, agg};
  });
  // 축 범위: 자동 맞춤(이상값은 가장자리에 ◆로 고정, 0 항상 포함) / 전체 범위
  const robust = scatterFit==='auto';
  const xr = fitAxis(pts.map(p=>p.xRaw), 10, robust), yr = fitAxis(pts.map(p=>p.yRaw), 2, robust);
  pts.forEach(p=>{
    p.x = Math.max(xr[0], Math.min(xr[1], p.xRaw));
    p.y = Math.max(yr[0], Math.min(yr[1], p.yRaw));
    p.clipped = (p.x!==p.xRaw || p.y!==p.yRaw);
  });
  const ds = charts.scatter.data.datasets[0];
  ds.data = pts; ds.clip = false;
  ds.pointStyle = pts.map(p=>p.clipped?'rectRot':'circle');
  ds.backgroundColor = pts.map((p,i)=>{
    const c = loadColor(p.agg.실제공수,p.agg.기준공수);
    const isSel = selectedEntity && selectedEntity.level===level && selectedEntity.value===scatterLabels[i];
    return (!selectedEntity || isSel) ? c : c+"33";
  });
  ds.pointRadius = scatterLabels.map((k,i)=>{
    const isSel = selectedEntity && selectedEntity.level===level && selectedEntity.value===k;
    const base = pts[i].clipped ? 10 : 9;
    return selectedEntity ? (isSel?13:7) : base;
  });
  charts.scatter.options.scales.x.min = xr[0]; charts.scatter.options.scales.x.max = xr[1];
  charts.scatter.options.scales.y.min = yr[0]; charts.scatter.options.scales.y.max = yr[1];
  charts.scatter.update();
}

function updateAvgDuration(){
  const base = baseFilteredRows();

/** 업무 구분별 비중 현황 — 자체 독립 레벨(levels.catMix) 기준으로 그룹핑 */
function updateCategoryMix(){
  const base = baseFilteredRows();
  const lvl = levels.catMix;
  const key = groupKeyFor(lvl);
  const groups = {};
  base.forEach(r=>{ (groups[r[key]]=groups[r[key]]||[]).push(r); });
  let keys = Object.keys(groups);
  // 평균소요시간과 동일한 정렬/개수 제한 기준(담당자 레벨 과다 방지)
  keys.sort((a,b)=> groups[b].length - groups[a].length);
  if(keys.length>25) keys = keys.slice(0,25);

  charts.catMix.data.labels = keys;
  if(charts.catMix.data.datasets.length!==ALL_CATS.length) charts.catMix.data.datasets = catMixDatasets();
  const relevant = selectedEntity && selectedEntity.level===lvl;
  ALL_CATS.forEach((cat,ci)=>{
    charts.catMix.data.datasets[ci].data = keys.map(k=>{
      const rows = groups[k];
      const tot = sum(rows.filter(r=>hasVal(r.adur)), r=>r.adur*F(r));
      if(tot<=0) return 0;
      const catSum = sum(rows.filter(r=>r.c===cat && hasVal(r.adur)), r=>r.adur*F(r));
      return r1(catSum/tot*100);
    });
    charts.catMix.data.datasets[ci].backgroundColor = keys.map(k=>{
      const isSel = relevant && selectedEntity.value===k;
      const c = CAT_COLORS[ci];
      return (!relevant || isSel) ? c : c+"33";
    });
  });
  charts.catMix.update();
}

function updateStacked(){
  const base = filteredRows();
  const orgs = [...new Set(base.map(r=>r.o))].sort();
  const core=[], support=[];
  orgs.forEach(o=>{
    const rows = base.filter(r=>r.o===o);
    const coreSum = sum(rows.filter(r=>CORE_CATS.has(r.c)), r=>(r.adur||0)*F(r));
    const supSum = sum(rows.filter(r=>!CORE_CATS.has(r.c)), r=>(r.adur||0)*F(r));
    const tot = coreSum+supSum || 1;
    core.push(r1(coreSum/tot*100)); support.push(r1(supSum/tot*100));
  });
  charts.stacked.data.labels = orgs;
  charts.stacked.data.datasets[0].data = core;
  charts.stacked.data.datasets[1].data = support;
  charts.stacked.update();
  const coreList = ALL_CATS.filter(c=>CORE_CATS.has(c)), supList = ALL_CATS.filter(c=>!CORE_CATS.has(c));
  document.getElementById("clsNote").innerHTML =
    (coreList.length? "" : '<div class="warn">※ CONFIG.CORE_CATS 에 지정한 핵심 업무 구분이 데이터에 없습니다. 전부 지원 업무로 집계 중이니 확인하세요.</div>') +

  buildTimelineChart(); updateTimeline();
}
function renderTlHeat(orgs, months, cnt, LC){
  const box=document.getElementById("tlHeat"); box.style.display="";
  if(!months.length||!orgs.length){box.innerHTML='<div class="hint">표시할 완료 업무가 없습니다</div>';return}
  const mx=Math.max(1,...orgs.flatMap(o=>cnt[o]));
  const head='<tr><th class="hl">조직</th>'+months.map(m=>'<th>'+m.slice(2).replace('-','.')+'</th>').join('')+'<th>합계</th></tr>';
  const rows=orgs.map((o,i)=>'<tr><td class="hl"><i style="background:'+LC[i%LC.length]+'"></i>'+o+'</td>'+cnt[o].map(v=>{
      const a=v? (0.12+0.78*v/mx):0; return '<td style="background:'+(v?'rgba(35,74,132,'+a.toFixed(2)+')':'transparent')+';color:'+(a>.5?'#fff':'#1b2a41')+'">'+(v||'·')+'</td>'}).join('')
    +'<td class="tt">'+cnt[o].reduce((x,y)=>x+y,0)+'</td></tr>').join('');
  box.innerHTML='<table class="heat">'+head+rows+'</table>';
}
function monthSeq(a,b){
  const out=[]; let [y,m]=a.split('-').map(Number); const [ey,em]=b.split('-').map(Number);
  while(y<ey || (y===ey && m<=em)){ out.push(y+"-"+String(m).padStart(2,"0")); m++; if(m>12){m=1;y++;} }
  return out;
}
function updateTimeline(){
  // 선택 기간 안에서 실제 완료된 업무만 (완료 월 기준), 업무가 있는 첫~마지막 월 사이는 빈 달도 0건으로 표시
  const base = filteredRows().filter(r=>r.ae && r.ae.slice(0,7)>=state.from && r.ae.slice(0,7)<=state.to);
  const present = [...new Set(base.map(r=>r.ae.slice(0,7)))].sort();
  const months = present.length ? monthSeq(present[0], present[present.length-1]) : [];
  charts.timeline.data.labels = months;
  if(timelineMode==='org'){
    const orgs=[...new Set(base.map(r=>r.o))];
    const tot={}; base.forEach(r=>{tot[r.o]=(tot[r.o]||0)+1;});
    orgs.sort((a,b)=>tot[b]-tot[a]);
    const LC=["#234A84","#E8833A","#2AA36B","#D64550","#8B5FBF","#B08900","#57B6A9","#C97BB8","#5B8FD6","#7B8794","#A0522D","#3C9D9B"];
    const cnt={}; orgs.forEach(o=>{cnt[o]=months.map(m=> base.filter(r=>r.o===o && r.ae.slice(0,7)===m).length)});
    charts.timeline.data.datasets = orgs.map((o,i)=>({
      type:"line", label:o, borderColor:LC[i%LC.length], backgroundColor:LC[i%LC.length], borderWidth:2.2, tension:0,
      pointRadius:3.5, pointHoverRadius:6, fill:false, data:cnt[o]}));
    renderTlHeat(orgs, months, cnt, LC);
  } else {
    document.getElementById("tlHeat").style.display="none";
    charts.timeline.data.datasets[0].data = months.map(m=> base.filter(r=>r.ae.slice(0,7)===m).length);
    charts.timeline.data.datasets[1].data = months.map(m=>{
      const rows = base.filter(r=>r.ae.slice(0,7)===m && r.adur!=="" && r.adur!==null);
      return rows.length? r1(sum(rows,r=>r.adur)/rows.length) : 0;
    });
  }
  charts.timeline.update();

  const coreShare = months.map(m=>{
    const rows = base.filter(r=>r.ae.slice(0,7)===m);
    const coreSum = sum(rows.filter(r=>CORE_CATS.has(r.c)), r=>r.adur||0);
    const totSum = sum(rows, r=>r.adur||0) || 1;
    return r1(coreSum/totSum*100);
  });
  charts.coreTrend.data.labels = months;
  charts.coreTrend.data.datasets[0].data = coreShare;
  charts.coreTrend.update();
}

/**
 * 과중 인원 비율 — 사양서 7-2 권고 반영:
 * 누적 전체 기간으로 비교하면 "최근에는 여유로운 사람도 과거 총합 때문에 과중"으로
 * 왜곡될 수 있어, 최근 4주(약 20영업일) 고정 기간으로 별도 계산한다.
 * (월 슬라이서와 무관하게 항상 "최신 데이터 기준 최근 4주"를 봄. 조직/직급/업무구분 필터는 반영)
 */
function overloadRateRecent(){
  const rows = RAW.filter(r=>{
    if(state.org && r.o!==state.org) return false;
    if(state.grade && r.g!==state.grade) return false;
    if(state.cat && r.c!==state.cat) return false;
    if(selectedEntity){
      const key = groupKeyFor(selectedEntity.level);
      if(r[key]!==selectedEntity.value) return false;
    }
    return true;
  });
  const dates = rows.map(r=>r.ae).filter(Boolean).sort();
  if(!dates.length) return 0;
  const latest = new Date(dates[dates.length-1]);
  const cutoff = new Date(latest); cutoff.setDate(cutoff.getDate()-27); // 약 4주
  const recent = rows.filter(r=> r.ae && new Date(r.ae) >= cutoff);
  recent.forEach(r=>{ r._f=1; });
  const wd = Math.max(1, networkDays(cutoff, latest));

  const persons = [...new Set(recent.map(r=>r.p))];
  if(!persons.length) return 0;
  let overCnt=0;
  persons.forEach(p=>{
    const prows = recent.filter(r=>r.p===p);
    const a = aggregate(prows, wd, 'person', p);
    if(a.실제공수 > a.기준공수) overCnt++;
  });
  return overCnt/persons.length*100;
}

/** 최근 4주 기준 담당자별 여유도 랭킹 — KPI '과중 인원 비율'과 동일한 계산 로직 재사용 */
function computeAvailabilityRanking(){
  const rows = RAW.filter(r=>{
    if(state.org && r.o!==state.org) return false;
    if(state.grade && r.g!==state.grade) return false;
    return true;
  });
  const dates = rows.map(r=>r.ae).filter(Boolean).sort();
  if(!dates.length) return [];
  const latest = new Date(dates[dates.length-1]);
  const cutoff = new Date(latest); cutoff.setDate(cutoff.getDate()-27);
  const recent = rows.filter(r=> r.ae && new Date(r.ae) >= cutoff);
  const wd = Math.max(1, networkDays(cutoff, latest));

  const persons = [...new Set(recent.map(r=>r.p))];
  const list = persons.map(p=>{
    const prows = recent.filter(r=>r.p===p);
    const a = aggregate(prows, wd, 'person', p);
    return {
      person: p, org: prows[0]?.o, grade: prows[0]?.g,
      실제공수: r1(a.실제공수), 기준공수: r1(a.기준공수),
      여유율: a.기준공수>0 ? r1((a.기준공수-a.실제공수)/a.기준공수*100) : 0,
      진행중업무: prows.length,
      지연율: r1(a.지연율*100),
    };
  });
  list.sort((a,b)=> b.여유율-a.여유율);
  return list;
}

async function sendChat(){

function candidateBlockHTML(list){

  ).join("") + `</div>`;
}

/** 데모 모드: 실제 계산된 랭킹을 정해진 문장 틀에 끼워넣기 (LLM 미연결) */
function demoAnswer(question, top3){
  if(!top3.length) return "최근 4주간 데이터가 부족해 추천할 인원을 찾지 못했습니다.";
  const best = top3[0];
  let html = `최근 4주 데이터를 기준으로 계산했을 때, 가장 여유 있는 담당자는 <b>${best.person}</b>님입니다 (${best.org} · ${best.grade}).<br>`;
  html += `현재 기준공수 대비 <b>${best.여유율}%</b> 여유가 있고, 진행 중인 업무는 ${best.진행중업무}건입니다.<br><br>`;
  html += `그 다음으로는 아래 순서로 배정을 검토해볼 수 있습니다.`;
  html += candidateBlockHTML(top3);
  return html;
}

/** 실시간 모드: 계산된 데이터를 근거로 Gemini API 호출 (계산은 이미 끝, LLM은 해석/문장만) */
async function callGeminiForAnswer(question, top3, bottom2){
  const systemPrompt =
`당신은 GST 기술연구소의 인력 배치를 돕는 도우미입니다.
아래 제공된 담당자별 계산 데이터만 근거로 답변하세요. 데이터에 없는 숫자나 이름을 지어내지 마세요.
추천 시 반드시 구체적인 수치(여유율, 진행중 업무 건수)를 함께 제시하고, 2~4문장으로 간결하게 답하세요.

[여유 있는 담당자 TOP3 - 최근 4주 기준]
${JSON.stringify(top3)}

[업무 부하가 큰 담당자 참고]
${JSON.stringify(bottom2)}`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${geminiApiKey}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ contents:[{ parts:[{ text: systemPrompt + "\n\n[질문]\n" + question }]}] })
  });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "(응답을 받지 못했습니다)";
  return text.replace(/\n/g,"<br>") + candidateBlockHTML(top3);
}

  t.cat=proj==='일반업무'?'gen':/^ZEX/.test(proj)?'ord':'dev';
  return t;
}
function build(){

  T.forEach(t=>{ if(!LIVE&&OV[t.id]!==undefined) t.ae=OV[t.id];

    t.started=t.ae!=null||(t.as!=null&&t.as<=TODAY);
    t.as=t.started?(t.as??t.ps):t.ps; });
  applyDeps();
  { /* 공동 담당 연결: 원본 업무ID 를 연결키로 사용 */
    const ids=new Set(T.map(t=>t.link).filter(Boolean));T.forEach(t=>{if(!t.link&&ids.has(String(t.id)))t.link=String(t.id)}) }

}
/* ═════ 선행(종속) 업무 ═════
   b 의 선행 업무가 a 일 때: b 는 a 가 끝난 다음 날부터 시작합니다.
   a 가 늦어져 (실제 완료일 또는 오늘까지 미완료) 끝나는 날이 b 의 예정 시작일보다 뒤가 되면,
   b 의 예정 일정은 '예정 소요일(기간)'을 그대로 유지한 채 뒤로 밀립니다 (연쇄 적용).
   · 원래 입력한 예정일은 ps0/pe0 에 보관 (시트에는 원래 값이 그대로 저장됨) · 이미 시작/완료된 업무는 밀지 않음 · 앞당기지는 않음 */
const predEnd=a=>a.ae!=null?a.ae:(a.pe<TODAY?TODAY:a.pe);
function applyDeps(){
  const byId=new Map(T.map(t=>[String(t.id),t]));
  T.forEach(t=>{t.ps0=t.ps;t.pe0=t.pe;t.shift=0;t.predT=null;t.subs=[]});
  T.forEach(t=>{if(t.pred){const a=byId.get(t.pred);if(a&&a!==t)t.predT=a}});
  const st=new Map();
  const visit=t=>{
    const z=st.get(t);if(z===2)return;if(z===1){t.predT=null;return}
    st.set(t,1);const a=t.predT;
    if(a){visit(a);
      if(t.predT&&!t.started&&t.ae==null){const min=predEnd(a)+1;if(t.ps0<min){const d=min-t.ps0;t.ps=t.ps0+d;t.pe=t.pe0+d;t.shift=d;t.as=t.ps}}}
    st.set(t,2)};
  T.forEach(visit);
  T.forEach(t=>{if(t.predT)t.predT.subs.push(t)});
}
const descOf=t=>{const out=new Set(),q=[t];while(q.length){const c=q.pop();(c.subs||[]).forEach(x=>{if(!out.has(x)){out.add(x);q.push(x)}})}return out};
const status=t=>t.ae!=null?'완료':(t.pe<TODAY?'지연':(t.started?'진행중':'예정'));
const spanS=t=>Math.min(t.ps,t.as), spanE=t=>t.ae!=null?Math.max(t.ae,t.pe):Math.max(t.pe,TODAY);
const barE=t=>t.ae!=null?t.ae:((!t.started||t.pe<TODAY)?Math.max(t.as,t.pe):Math.max(TODAY,t.as));
function pct(t){ if(t.ae!=null)return 100; if(!t.started)return 0; const d=Math.max(1,t.pe-t.as); return Math.max(5,Math.min(95,Math.round((TODAY-t.as)/d*100))); }
const coOf=t=>t.link?T.filter(x=>x.link===t.link&&x!==t):[];
const delayDays=t=>{const e=t.ae!=null?t.ae:TODAY;return e>t.pe?e-t.pe:0};
const catName={dev:'개발',ord:'수주',gen:'일반'};

function resetFilters(keepGrp){
  const g=keepGrp??S.f.grp;
  S.f={from:TODAY-27,to:TODAY+7,grp:g,team:'',proj:'',person:'',cat:'',status:''};
}
function base(ignoreStatus,ignorePeriod){
  const f=S.f, p=f.person.trim();
  return T.filter(t=>{
    if(f.grp&&t.grp!==f.grp)return false;
    if(f.team&&t.org!==f.team)return false;
    if(f.proj&&t.proj!==f.proj)return false;
    if(f.cat&&t.cat!==f.cat)return false;
    if(p&&!t.person.includes(p))return false;
    if(!ignorePeriod&&(spanE(t)<f.from||spanS(t)>f.to))return false;
    if(!ignoreStatus&&f.status&&status(t)!==f.status)return false;
    return true;
  });
}

/* ── 타임라인 공통 ── */
const DW={day:26,week:14,month:4};
const STC=['#6f95e8','#3f6fd8','#1f9d8a','#e08a2c','#8a63d2','#d0568a'];
const rng=(a,b,open)=>a==null&&b==null?'-':(a==null?'':md(a))+'~'+(b==null?(open||''):md(b));
const pctBar=(p,cls)=>`<div class="pg ${cls||''}"><i><b style="width:${Math.min(100,p)}%"></b></i>${p}%</div>`;
function tlRange(w,L){let a=S.f.from-2,b=S.f.to+2;const need=Math.ceil(((w||1200)-L)/DW[S.scale])+2;if(b-a<need)b=a+need;if(b-a<20)b=a+20;if(b-a>900)b=a+900;return [a,b]}
/* 주차 표기: 월요일 시작, 그 주 목요일이 속한 달의 N주 (예: 7월 1주) */
const monOf=d=>d-((dObj(d).getUTCDay()+6)%7);
function weekInfo(mon){const th=dObj(mon+3);return {y:th.getUTCFullYear(),m:th.getUTCMonth()+1,n:Math.floor((th.getUTCDate()-1)/7)+1}}
const mdd=d=>(dObj(d).getUTCMonth()+1)+'/'+dObj(d).getUTCDate();
function tlHead(a,b,dw,leftHtml){
  let h='';const W=(b-a+1)*dw,cell=(cls,s,e,html,extra)=>{const l=Math.max(s,a),r=Math.min(e,b);if(r<l)return '';return `<div class="${cls}" style="left:${(l-a)*dw}px;width:${(r-l+1)*dw}px"${extra||''}>${html}</div>`};
  const months=(withYear)=>{let d=a;while(d<=b){const o=dObj(d),y=o.getUTCFullYear(),m=o.getUTCMonth(),nx=Math.round(Date.UTC(y,m+1,1)/DAY);const e=Math.min(b+1,nx);
    h+=`<div class="m" style="left:${(d-a)*dw}px;width:${(e-d)*dw}px">${(e-d)*dw>(withYear?60:34)?(withYear||m===0||d===a?y+'년 ':'')+(m+1)+'월':''}</div>`;d=e}};
  if(S.scale==='day'){
    for(let mon=monOf(a);mon<=b;mon+=7){const w=weekInfo(mon),wide=7*dw>=170,first=mon<=a||w.m===1&&w.n===1;
      h+=cell('m',mon,mon+6,`${first?w.y+'년 ':''}${w.m}월 ${w.n}주${wide?` <span class="rg">${mdd(mon)}~${mdd(mon+6)}</span>`:''}`)}
    for(let d=a;d<=b;d++){const wd=dObj(d).getUTCDay();h+=`<div class="d dd ${wd===0||wd===6?'we':''} ${d===TODAY?'td':''}" style="left:${(d-a)*dw}px;width:${dw}px">${dObj(d).getUTCDate()}<small>${'일월화수목금토'[wd]}</small></div>`}
  }else if(S.scale==='week'){
    months(true);
    for(let mon=monOf(a);mon<=b;mon+=7){const w=weekInfo(mon),cur=TODAY>=mon&&TODAY<=mon+6;
      h+=cell('d dd wk'+(cur?' td2':''),mon,mon+6,`${w.n}주<small>${mdd(mon)}</small>`,` title="${w.m}월 ${w.n}주 (${mdd(mon)}~${mdd(mon+6)})"`)}
  }else{
    for(let y=dObj(a).getUTCFullYear();y<=dObj(b).getUTCFullYear();y++){const s0=Math.round(Date.UTC(y,0,1)/DAY),e0=Math.round(Date.UTC(y+1,0,1)/DAY)-1;h+=cell('m',s0,e0,y+'년')}
    for(let y=dObj(a).getUTCFullYear();y<=dObj(b).getUTCFullYear();y++)for(let m=0;m<12;m++){const s0=Math.round(Date.UTC(y,m,1)/DAY),e0=Math.round(Date.UTC(y,m+1,1)/DAY)-1,cur=TODAY>=s0&&TODAY<=e0;
      h+=cell('d dd mo'+(cur?' td2':''),s0,e0,(m+1)+'월')}
  }
  return `<div class="gh"><div class="l">${leftHtml}</div><div class="r" style="width:${W}px">${h}</div></div>`;
}
function tlOverlay(a,b,dw,H){
  const W=(b-a+1)*dw;let bg='',vl='';
  if(S.scale==='day'){const w0=dObj(a).getUTCDay();
    bg=`background-image:linear-gradient(to right,rgba(120,135,170,.08) ${2*dw}px,transparent ${2*dw}px);background-size:${7*dw}px 100%;background-position:${((6-w0+7)%7)*dw-7*dw}px 0;`}
  else if(S.scale==='week'){for(let mon=monOf(a);mon<=b;mon+=7)if(mon>a)vl+=`<i class="vl" style="left:${(mon-a)*dw}px"></i>`}
  else{for(let d=a;d<=b;){const o=dObj(d),nx=Math.round(Date.UTC(o.getUTCFullYear(),o.getUTCMonth()+1,1)/DAY);if(nx<=b)vl+=`<i class="vl" style="left:${(nx-a)*dw}px"></i>`;d=nx}}
  const tl=(TODAY>=a&&TODAY<=b)?`<div class="tl" style="left:${(TODAY-a+.5)*dw-1}px"></div>`:'';
  return `<div class="ov" style="left:var(--L);width:${W}px;height:${H}px;${bg}">${vl}${tl}</div>`;
}
const sizeCls=L=>L<370?'s4':L<470?'s3':L<580?'s2':L<700?'s1':'';

/* ── 목록·간트 (프로젝트 → 단계 → 업무 흐름) ── */
const stSt=s=>s.done?'완료':(s.pe!=null&&s.pe<TODAY?'지연':(s.started?'진행중':'예정'));
const pjSt=p=>({'진행':'진행중','미착수':'예정','지연':'지연','완료':'완료'})[p.status]||'진행중';
function buildItems(list){const it=buildItems0(list);return (S.scale==='month'&&S.group!=='none')?it.filter(x=>x.k!=='task'):it}
function buildItems0(list){
  const g=S.group, col=k=>S.collapsed.has(k);
  const byDate=(x,y)=>y.as-x.as||y.ps-x.ps;
  if(g==='none')return list.slice().sort(byDate).map(t=>({k:'task',t,ind:0}));
  if(g==='person'){
    const m=new Map();list.forEach(t=>{if(!m.has(t.person))m.set(t.person,[]);m.get(t.person).push(t)});
    const out=[];[...m.entries()].sort((a,b)=>b[1].length-a[1].length).forEach(([k,ts])=>{
      const key='G'+k;out.push({k:'grp',key,name:k,ts,filter:'person'});
      if(!col(key))ts.sort(byDate).forEach(t=>out.push({k:'task',t,ind:1}))});
    return out;
  }
  const m=new Map();list.forEach(t=>{if(!m.has(t.proj))m.set(t.proj,[]);m.get(t.proj).push(t)});
  const names=[...m.keys()].sort((a,b)=>(a==='일반업무')-(b==='일반업무')||(PRJM.has(b)-PRJM.has(a))||a.localeCompare(b,'ko'));
  const out=[];
  for(const name of names){
    const ts=m.get(name),p=PRJM.get(name);

  const mo=dObj(S.calMonth),y=mo.getUTCFullYear(),m=mo.getUTCMonth();
  const first=S.calMonth, startDow=dObj(first).getUTCDay(), gridStart=first-startDow;
  const nextM=Math.round(Date.UTC(y,m+1,1)/DAY), weeks=Math.ceil((nextM-gridStart)/7);

  const list=base(false,true).filter(t=>cE(t)>=gridStart&&cS(t)<gridStart+weeks*7);
  const MAXL=4;let html='';

    ts.forEach(t=>{const s=Math.max(cS(t),ws),e=Math.min(cE(t),we);let l=lanes.findIndex(x=>x<s);if(l<0){l=lanes.length;lanes.push(e)}else lanes[l]=e;place.push({t,s,e,l})});

      bars+=`<div class="cb ${SCLS[status(p.t)]}" data-tid="${p.t.id}" style="left:calc(${(p.s-ws)/7*100}% + 2px);width:calc(${(p.e-p.s+1)/7*100}% - 4px);top:${24+p.l*19}px" title="${esc(p.t.title)}">${esc(p.t.title)}</div>`});
    hid.forEach((n,i)=>{if(n)bars+=`<div class="cm" style="left:calc(${i/7*100}% + 6px);top:${24+MAXL*19}px">+${n}건</div>`});
    let dn='';for(let i=0;i<7;i++){const d=ws+i,o=dObj(d);dn+=`<div class="${o.getUTCMonth()!==m?'o':''} ${d===TODAY?'t':''}" style="left:${i/7*100}%"><b>${o.getUTCDate()}</b></div>`}

  }
  host.innerHTML=`<div class="cal"><div class="cal-h"><button class="sm" id="cPrev">◀</button><b>${y}년 ${m+1}월</b><button class="sm" id="cNext">▶</button><button class="sm" id="cToday">오늘</button><span class="hint" style="margin-left:8px">${list.length}건</span></div><div class="cal-dow">${'일월화수목금토'.split('').map(x=>`<div>${x}</div>`).join('')}</div>${html}</div>`;
  $('#cPrev').onclick=()=>{S.calMonth=Math.round(Date.UTC(y,m-1,1)/DAY);viewCal(host)};
  $('#cNext').onclick=()=>{S.calMonth=nextM;viewCal(host)};
  $('#cToday').onclick=()=>{S.calMonth=0;viewCal(host)};
  host.onclick=e=>{const r=e.target.closest('[data-tid]');if(r)openDrawer(r.dataset.tid)};
}

/* ═════════ 프로젝트 마스터 (단계별 계획/실적) ═════════ */
let MASTERS=[], PRJ=[], PRJM=new Map();
const prjGrp=(team,item)=>{const t=String(team||''),i=String(item||'');for(const g of GROUPS){if(t.startsWith(g)||i.startsWith(g))return g}
  const u=i.toUpperCase();if(u.startsWith('CHILLER'))return '칠러';if(u.startsWith('SCRUBBER'))return '스크러버';return '기술연구소'};
let STT=new Map();
function indexStageTasks(){STT=new Map();T.forEach(t=>{if(t.proj==='일반업무')return;const k=t.proj+'\u0001'+(t.stage||'');const a=STT.get(k);if(a)a.push(t);else STT.set(k,[t])})}
function buildPrj(){
  PRJ=[];PRJM=new Map();indexStageTasks();
  MASTERS.forEach(m=>m.items.forEach(it=>{
    const p={name:it.proj,cat:m.kind,team:it.team,item:it.item,div:it.div,major:it.major,note:it.note||'',owner:it.owner||'',grp:prjGrp(it.team,it.item),names:m.stages,
      stages:m.stages.map((n,i)=>({name:n,i,ps:toDay(it.d[i][0]),pe:toDay(it.d[i][1]),as:toDay(it.d[i][2]),ae:toDay(it.d[i][3])}))};
    PRJ.push(p);PRJM.set(p.name,p)}));
  const miss=new Map();
  T.forEach(t=>{if(t.proj==='일반업무'||PRJM.has(t.proj))return;if(!miss.has(t.proj))miss.set(t.proj,[]);miss.get(t.proj).push(t)});
  for(const [name,ts] of miss){
    const cat=/^ZEX/.test(name)?'ord':'dev',names=cat==='ord'?ORD_ST:DEV_ST,gc={};ts.forEach(t=>gc[t.grp]=(gc[t.grp]||0)+1);
    const g=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0][0];
    const p={name,cat,team:ts[0].org,item:g,div:'',major:'',note:'(마스터 없음 · 업무 기록으로 추정)',inferred:true,owner:'',grp:g,names,
      stages:names.map((n,i)=>{const x=ts.filter(t=>t.stage===n);if(!x.length)return {name:n,i,ps:null,pe:null,as:null,ae:null};
        return {name:n,i,ps:Math.min(...x.map(t=>t.ps)),pe:Math.max(...x.map(t=>Math.min(t.pe,TODAY+365))),as:Math.min(...x.map(t=>t.as)),ae:x.every(t=>t.ae!=null)?Math.max(...x.map(t=>t.ae)):null}})};
    PRJ.push(p);PRJM.set(name,p);
