  T.forEach(t=>{const p=PRJM.get(t.proj);if(p)t.cat=p.cat});
}
/* 단계·프로젝트의 '실제' 값은 모두 업무 기록에서 계산합니다
   - 단계 실제 시작일 = 그 단계 업무 중 진행 시작된 것의 가장 이른 실제 시작일
   - 단계 완료 = 그 단계 업무가 1건 이상이고 전부 완료 / 실제 완료일 = 마지막 완료일
   - 단계 진행률 = 업무 진행률의 기간 가중 평균 (완료 100%, 미착수 0%)  → 업무가 남아 있으면 100%가 될 수 없음
   - 프로젝트 실제 시작일 = 가장 이른 단계 실제 시작일 / 실제 완료일 = 전 단계 완료 시 마지막 완료일 */
function calcPrj(p){
  const N=p.stages.length;let sum=0,late=false,allDone=true,anyStart=false,delay=0;
  p.stages.forEach((s,i)=>{
    const ts=STT.get(p.name+'\u0001'+s.name)||[],st=ts.filter(t=>t.started);
    s.n=ts.length;s.open=ts.filter(t=>t.ae==null).length;
    s.as=st.length?Math.min(...st.map(t=>t.as)):null;
    s.done=ts.length>0&&s.open===0;
    s.ae=s.done?Math.max(...ts.map(t=>t.ae)):null;
    s.started=s.as!=null;
    const dur=(s.ps!=null&&s.pe!=null)?Math.max(1,s.pe-s.ps):1;
    s.dur=dur;
    s.tgt=s.ps==null?0:Math.max(0,Math.min(1,(TODAY-s.ps)/dur));
    if(ts.length){let w=0,a=0;ts.forEach(t=>{const d=Math.max(1,t.pe-t.ps+1);w+=d;a+=d*pct(t)});s.pct=Math.round(a/w)}else s.pct=0;
    s.act=s.pct/100;sum+=s.act/N;
    if(s.started)anyStart=true;if(!s.done)allDone=false;
    s.delay=s.done?Math.max(0,s.ae-(s.pe??s.ae)):(s.pe!=null&&s.pe<TODAY?TODAY-s.pe:0);
    s.late=s.delay>0;
    if(!s.done&&s.pe!=null&&s.pe<TODAY)late=true;
    delay=Math.max(delay,s.delay);
  });
  p.overall=Math.round(sum*1000)/10;p.delay=delay;p.allDone=allDone&&N>0;
  const run=p.stages.filter(s=>s.started&&!s.done).map(s=>s.name);
  p.curIdx=p.stages.findIndex(s=>!s.done);
  p.cur=p.allDone?'완료':run.length?run.join('&'):(anyStart?'대기':'미착수');
  p.status=p.allDone?'완료':late?'지연':anyStart?'진행':'미착수';
  const ps=p.stages.map(s=>s.ps).filter(x=>x!=null),pe=p.stages.map(s=>s.pe).filter(x=>x!=null),as=p.stages.map(s=>s.as).filter(x=>x!=null);
  p.start=ps.length?Math.min(...ps):null;p.end=pe.length?Math.max(...pe):null;p.as0=as.length?Math.min(...as):null;
  p.ae1=p.allDone?Math.max(...p.stages.map(s=>s.ae)):null;
  p.dday=p.end==null?null:p.end-TODAY;
}
const PST={'진행':'run','지연':'late','완료':'done','미착수':'plan'};
const dnote=d=>d==null?'':d>=0?`D-${d}`:`D+${-d}`;
const ymd=d=>{const o=dObj(d);return String(o.getUTCFullYear()).slice(2)+'.'+String(o.getUTCMonth()+1).padStart(2,'0')};

/* 월보 p.2 스타일 단계 일정 보드 */
function boardGeom(p){
  const ds=p.stages.flatMap(s=>[s.ps,s.pe,s.as,s.ae]).filter(x=>x!=null);
  if(!ds.length)return null;
  const o0=dObj(Math.min(...ds,TODAY)),o1=dObj(Math.max(...ds,TODAY));
  const a0=Math.round(Date.UTC(o0.getUTCFullYear(),o0.getUTCMonth(),1)/DAY),a1=Math.round(Date.UTC(o1.getUTCFullYear(),o1.getUTCMonth()+1,1)/DAY)-1;
  const span=a1-a0+1,months=[];
  for(let d=a0;d<=a1;){const o=dObj(d),nx=Math.round(Date.UTC(o.getUTCFullYear(),o.getUTCMonth()+1,1)/DAY);months.push({a:d,b:Math.min(a1,nx-1),lb:(o.getUTCMonth()===0||d===a0)?ymd(d):(o.getUTCMonth()+1)+'월'});d=nx}
  return {a0,a1,span,months,pc:d=>((d-a0)/span*100),wd:(x,y)=>((y-x+1)/span*100)};
}
function stageBoard(p){

const SLOG=[];   /* 미리보기 모드 변경이력 */

const wtFor=(k,n)=>(WTS[k]&&WTS[k].length===n)?WTS[k]:Array(n).fill(1/n);
function distribute(a,b,wt){
  const tot=b-a+1,out=[];let acc=0,cur=a;
  wt.forEach((w,i)=>{acc+=w;const end=i===wt.length-1?b:Math.min(b,Math.max(cur,a+Math.round(tot*acc)-1));out.push([cur,end]);cur=Math.min(b,end+1)});
  return out;
}
const canEditProj=p=>{const m=ME();return !SESSION||m.admin||(p.owner&&p.owner===m.name)||(m.lead&&grpOf(m.org)===p.grp)};

function logLocal(kind,target,field,before,after,why){

}

  }

/* ═════════ 업무 일정 수정 ═════════ */
function rowOfTask(t){
  if(LIVE)return LIVE.find(r=>String(r[11])===String(t.id));
  if(typeof t.id==='number')return RAW.rows[t.id];
  return NEW[+String(t.id).slice(1)];
}
/* 공동 담당자: 같은 업무를 상대방 명의의 '본인 업무'로 복사해 등록합니다 (연결키로 묶임 · 완료/시작은 각자 처리) */
async function coAdd(id,name){
  const t=T.find(x=>String(x.id)===String(id));if(!t)return;name=name.trim();
  if(!name)return toast('추가할 담당자 이름을 입력해 주세요');
  if(name===t.person||coOf(t).some(x=>x.person===name))return toast('이미 포함된 담당자입니다');
  if(!PERSON[name])return toast('등록된 사용자만 추가할 수 있습니다 (이름 확인)');
  const link=t.link||String(t.id);
  try{
    if(LIVE){const r=await apiPost({action:'coadd',id:String(t.id),names:[name]});if(!r.ok)throw new Error(r.error||'저장 실패');
      const o=rowOfTask(t);if(o)o[12]=r.link;r.rows.forEach(x=>LIVE.push(x))}
    else{const o=rowOfTask(t);if(o)o[12]=link;const inf=PERSON[name];
      NEW.push([t.proj,t.title,t.kind,iso(t.ps0),iso(t.pe0),null,null,t.stage||null,name,inf.rank,inf.org,null,link,t.pred||'']);lsSet('gst_new',NEW);
      logLocal('업무',t.title,'공동 담당자','',name,'공동 담당자 추가')}
    build();toast(`${name}님을 공동 담당자로 추가했습니다`);openTaskEdit(id);
  }catch(e){toast('저장 실패: '+e.message)}
}
async function coRemove(id,cid){
  const x=T.find(v=>String(v.id)===String(cid));if(!x)return;
  if(x.started||x.ae!=null)return toast('이미 진행/완료된 업무는 제거할 수 없습니다');
  try{
    if(LIVE){const r=await apiPost({action:'coremove',id:String(cid)});if(!r.ok)throw new Error(r.error||'저장 실패');
      const i=LIVE.findIndex(v=>String(v[11])===String(cid));if(i>=0)LIVE.splice(i,1)}
    else{if(!x.isNew)return toast('샘플 원본 데이터는 제거할 수 없습니다');NEW.splice(+String(x.id).slice(1),1);lsSet('gst_new',NEW);logLocal('업무',x.title,'공동 담당자',x.person,'','공동 담당자 제거')}
    build();toast('공동 담당자를 제거했습니다');openTaskEdit(id);
  }catch(e){toast('저장 실패: '+e.message)}
}
function predCands(t){
  const ex=descOf(t);
  return T.filter(x=>x!==t&&!ex.has(x)&&x.proj===t.proj&&(t.proj!=='일반업무'||x.person===t.person)&&(x.ae==null||String(x.id)===t.pred)).sort((a,b)=>a.ps-b.ps).slice(0,300);
}

  <h4>일정</h4>

   <div class="fld"><label>예정 시작일</label><input type="date" id="xPS" value="${iso(t.ps0)}"></div><div class="fld"><label>예정 완료일</label><input type="date" id="xPE" value="${iso(t.pe0)}"></div>
   <div class="fld"><label>실제 시작일 <span class="hint">(시작 전은 비움)</span></label><input type="date" id="xAS" value="${t.started?iso(t.as):''}"></div><div class="fld"><label>실제 완료일 <span class="hint">(미완료는 비움)</span></label><input type="date" id="xAE" value="${t.ae!=null?iso(t.ae):''}"></div>
   <div class="fld full"><label>수정 사유 (필수)</label><input id="xWhy" placeholder="예: PMS 미등록 보정 / 일정 변경">${co.length?'<span class="hint">※ 예정 일정을 바꾸면 공동 담당자의 같은 업무 예정 일정도 함께 바뀝니다</span>':''}</div></div>
  <div style="text-align:right;margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="pbtn sub" id="xNo">취소</button><button class="pbtn" id="xOk">저장</button></div>`;
  $('#modal').classList.add('on');

  $$('#mbox [data-cr]').forEach(a=>a.onclick=()=>coRemove(t.id,a.dataset.cr));

        [['예정 시작일',iso(t.ps0),ps],['예정 완료일',iso(t.pe0),pe],['실제 시작일',t.started?iso(t.as):'',as||''],['실제 완료일',t.ae!=null?iso(t.ae):'',ae||''],['선행 업무',t.pred,pred]].forEach(([f,b,a])=>{if(b!==a)logLocal('업무',t.title,f,b,a,why)})}

/* ═════════ 데이터 점검 (과거 데이터 이관 후 보정) ═════════ */
const AU={tab:'stale',old:60,team:'',person:'',log:null};
let AUDIT=null;
function auditData(){
  const idx=new Map();T.forEach(t=>{const k=t.proj+'\u0001'+(t.stage||'');const a=idx.get(k);if(a)a.push(t);else idx.set(k,[t])});
  const A={stale:[],range:[],wait:[],bad:[],nomaster:[]};
  T.forEach(t=>{
    if(t.ae==null&&t.pe<TODAY-AU.old)A.stale.push(t);
    if(t.ae==null&&!t.started&&t.ps<TODAY&&t.pe>=TODAY)A.wait.push({t,k:'wait',msg:`예정 시작일(${md(t.ps)})이 지났는데 아직 '진행 시작' 처리가 안 됨 (${TODAY-t.ps}일 경과)`});
    if(t.pe<t.ps)A.bad.push({t,msg:'예정 완료일이 시작일보다 빠름'});else if(t.ae!=null&&t.started&&t.ae<t.as)A.bad.push({t,msg:'실제 완료일이 시작일보다 빠름'});
  });
  PRJ.forEach(p=>{
    if(p.inferred)A.nomaster.push({p,msg:`프로젝트 마스터에 없음 — 업무 ${T.filter(t=>t.proj===p.name).length}건으로 단계 일정을 추정해 표시 중`});
    p.stages.forEach(s=>{
      if(s.ps!=null&&s.pe!=null&&s.pe<s.ps)A.bad.push({p,s,msg:`${s.name}: 계획 완료일이 시작일보다 빠름`});
      const ts=idx.get(p.name+'\u0001'+s.name)||[];
      if(p.inferred||!ts.length)return;
      if(s.ps!=null&&s.pe!=null){
        const out=ts.filter(t=>t.ps<s.ps-14||t.pe>s.pe+14);
        if(out.length)A.range.push({p,s,msg:`업무 ${out.length}/${ts.length}건이 단계 계획기간(${md(s.ps)}~${md(s.pe)})을 14일 이상 벗어남`,
          fix:{[s.i]:{ps:iso(Math.min(s.ps,...out.map(t=>t.ps))),pe:iso(Math.max(s.pe,...out.map(t=>t.pe)))}}});
      }
    });
  });
  return A;
}
const auditN=A=>A.stale.length+A.range.length+A.wait.length+A.bad.length+A.nomaster.length;

  if(!AUDIT)AUDIT=auditData();

/* ═════════ 분석 (기술연구소 업무 현황 분석 대시보드 — 별도 화면을 그대로 내장, 데이터만 앱에서 전달) ═════════ */
let HEADS={};
const CORE_KIND=new Set(['개발','개발 기획','Test','설계 변경','표준·기술 문서','표준,기술 문서']);
/* 업무소요시간: 평일(월~금) 하루 8시간(08~17시, 점심 1시간 제외) · 시작일 포함 ~ 종료일 미포함 */
function weekdays(a,b){if(a==null||b==null||b<=a)return 0;const n=b-a,full=Math.floor(n/7),w0=dObj(a+full*7).getUTCDay();let c=full*5;for(let i=0;i<n%7;i++){const x=(w0+i)%7;if(x>=1&&x<=5)c++}return c}
const workH=(a,b)=>weekdays(a,b)*8, r1=x=>Math.round(x*10)/10;
function anRows(){
  return T.map(t=>{
    const as=t.started?t.as:null,ae=t.ae,ps=t.ps0,pe=t.pe0,both=(as!=null&&ae!=null),pf=(pe!=null&&ae!=null),sf=(ps!=null&&as!=null);
    const dur=both?r1(workH(as,ae)):'',delay=pf?(ae>pe?r1(workH(pe,ae)):0):'',short=pf?(ae<pe?r1(workH(ae,pe)):0):'';
    return {c:String(t.kind||'').trim(),lc:CORE_KIND.has(String(t.kind||'').trim())?'핵심 연구 업무':'지원 업무',p:t.person,g:t.rank,o:t.org,
      as:as!=null?iso(as):'',ae:ae!=null?iso(ae):'',dur,delay,edur:(ps!=null&&pe!=null)?r1(workH(ps,pe)):'',adur:dur,
      sdelay:sf?(as>ps?r1(workH(ps,as)):0):'',dcnt:pf?(ae>pe?1:0):'',sdcnt:sf?(as>ps?1:0):'',short,devh:pf?r1(delay-short):''};
  }).filter(r=>r.o&&r.p);
}
function pageAnalysis(){
  $('#main').innerHTML=header('분석')+`<div class="card anw"><div class="anmsg" id="anMsg">분석 화면 불러오는 중…</div><iframe class="anf" id="anFrame" title="업무 현황 분석"></iframe></div>`;
  bindHeader();
  const msg=(t,err)=>{const m=$('#anMsg');if(m){m.style.display='flex';m.style.zIndex=2;m.style.background='var(--card,#fff)';m.innerHTML='<div><b>'+(err?'분석 화면을 표시하지 못했습니다':'')+'</b><br>'+String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</div>'}};
  try{
    const num=v=>Number(v)||0,hT=((HEADS&&HEADS.teams&&HEADS.teams.rows)||[]).map(r=>({o:String(r[0]).trim(),n:num(r[1])})).filter(h=>h.o&&h.n>0),
          hG=((HEADS&&HEADS.grades&&HEADS.grades.rows)||[]).map(r=>({o:String(r[0]).trim(),g:String(r[1]).trim(),n:num(r[2])})).filter(h=>h.o&&h.g&&h.n>0);
    const payload={raw:anRows(),headT:hT,headG:hG};
    /* 내장 화면 오류를 눈에 보이게(+부모에 전달) */
    const guard='<script>(function(){function show(m){try{parent.postMessage({gstAnErr:String(m)},"*")}catch(e){}}'
      +'window.addEventListener("error",function(e){show((e.message||"error")+" @"+(e.lineno||"")+":"+(e.colno||""))});'
      +'window.addEventListener("unhandledrejection",function(e){show("promise: "+(e.reason&&e.reason.message||e.reason))});'
      +'window.addEventListener("load",function(){try{parent.postMessage({gstAnOk:1},"*")}catch(e){}})})();<\/script>';
    const inj=guard+'<script>window.__GST='+JSON.stringify(payload).replace(/</g,'\\u003c')+';<\/script>';
    let html=$('#anSrc').textContent.replace(/@@LT@@/g,'<');
    /* 외부 글꼴(구글 폰트) 요청이 막힌 사내망에서도 화면이 멈추지 않도록 제거 → 시스템 글꼴 사용 */
    html=html.replace(/<link[^>]*fonts\.g[^>]*>/gi,'');
    html=html.replace('<head>',()=>'<head>'+inj);
    window.__anOnMsg&&window.removeEventListener('message',window.__anOnMsg);
    window.__anOnMsg=ev=>{const d=ev.data||{};if(d.gstAnOk){const m=$('#anMsg');if(m)m.style.display='none'}else if(d.gstAnErr){msg(d.gstAnErr,true)}};
    window.addEventListener('message',window.__anOnMsg);
    $('#anFrame').srcdoc=html;
  }catch(err){console.error(err);msg((err&&err.message)||err,true)}
}

  /* p.1 — 현황표 */

        if(t!=null)sl.addText(String(t),Object.assign({x:x+0.04,y:yy,w:w-0.08,h:0.34,fontFace:F,fontSize:9.5,color:'1C2333',valign:'middle',margin:0},o));x+=w};

    $('#ePS').value=iso(predEnd(pa)+1);$('#ePE').value=iso(predEnd(pa)+1+Math.max(0,pa.pe0-pa.ps0));

        if(!r.ok)throw new Error(r.error||'저장 실패');

    S.f.from=Math.min(S.f.from,toDay(ps));S.f.to=Math.max(S.f.to,toDay(pe));

/*DEMO_START — 미리보기용 샘플 생성기 (로그인 파트를 붙이면 호출되지 않음 · 통째로 삭제해도 무방)*/
function startDemo(){
  DEMO=true;let sd=11;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pk=a=>a[Math.floor(rnd()*a.length)];
  const D=n=>iso(TODAY+n);
  const TEAM={'스크러버':['스크러버개발1팀',['김하늘','이도윤','박서준','최지우']],'칠러':['칠러개발2팀',['정민재','한유진','오세훈','윤아름']],'DCS':['DCS개발팀',['임수빈','송지호']],'전략부품':['전략부품개발팀',['장예은','배준호']],'제1연구소':['제1연구소 기획팀',['강다현','안은솔','문태양','서지민','홍가람','류시우']]};
  const RK=['사원','주임','대리','과장'],who=g=>{const p=pk(TEAM[g][1]);return [p,RK[p.charCodeAt(0)%4],TEAM[g][0]]};
  const KIND=['개발','개발 기획','Test','설계 변경','표준·기술 문서','검토','Etc','내부 회의','교육','개선 활동'],rows=[],items={dev:[],ord:[]};
  const PJ=[['dev','스크러버','SCR-A100 Wet 스크러버 개발',-230],['dev','스크러버','SCR-B200 Burn-Wet 스크러버 개발',-150],['dev','스크러버','SCR-C300 Plasma 스크러버 개발',-80],
   ['dev','칠러','CH-100 초저온 칠러 개발',-200],['dev','칠러','CH-300 Dual 채널 칠러 개발',-260],['dev','칠러','CH-500 수냉식 칠러 개발',-60],
   ['dev','DCS','DCS-2 원격 모니터링 시스템 개발',-170],['dev','전략부품','전략부품 국산화 개발',-120],['dev','제1연구소','연구소 업무관리 플랫폼 개발',-140],['dev','제1연구소','공정 데이터 분석 시스템 개발',-70],
   ['ord','스크러버','ZEX6764_M F16_6대',-200],['ord','칠러','ZEX6905_H P4_8대',-170],['ord','칠러','ZEX7133_S X2_10대',-110]];
  const WT={dev:[.2,.35,.25,.2],ord:[.1,.25,.2,.25,.1,.1]},NM={dev:DEV_ST,ord:ORD_ST};
  PJ.forEach(([k,g,name,off],pi)=>{
    const wt=WT[k],names=NM[k],total=ri(280,380);let cur=TODAY+off;const d=[];
    names.forEach((n,i)=>{const len=Math.max(8,Math.round(total*wt[i]));const ps=cur,pe=cur+len-1;cur=pe+1;
      let as=null,ae=null;
      if(ps<=TODAY){as=ps+ri(0,9);if(pe<TODAY-ri(0,30))ae=pe+ri(-3,28)}
      d.push([D(ps-TODAY),D(pe-TODAY),as==null?null:D(as-TODAY),ae==null?null:D(ae-TODAY)]);
      const nt=ri(3,4);
      let prevIdx=-1,prevTe=0;
      for(let j=0;j<nt;j++){const [p,rk,org]=who(g);let ts=ps+ri(0,Math.max(1,len-12)),pred='';
        if(j>0&&prevIdx>=0&&rnd()<.6){ts=Math.min(Math.max(ps,pe-5),prevTe+1);pred=String(prevIdx)}   /* 앞 업무 다음에 하는 종속 업무 */
        const te=Math.min(pe,ts+ri(7,24)),past=te<TODAY;
        let tas=as==null?null:Math.max(as,ts),tae=past&&rnd()<.82?te+ri(-2,6):null;
        if(as==null){tas=null}
        if(ae!=null&&tae==null&&rnd()<.5)tae=ae;                       /* 단계는 완료인데 일부 업무가 미완료로 남은 경우 */
        rows.push([name,pk(['설계 검토','도면 작성','사양 확정','시험 준비','자재 확인','성능 시험','문서 정리','공정 점검'])+' '+(j+1),pk(KIND),D(ts-TODAY),D(te-TODAY),tas==null?D(ts-TODAY):D(tas-TODAY),tae==null?null:D(tae-TODAY),n,p,rk,org,undefined,'',pred]);prevIdx=rows.length-1;prevTe=te}
    });
    if(pi===PJ.length-1)return;                                                   /* 마지막 수주 프로젝트는 마스터 없이 업무 기록만 (점검 화면 예시) */
    const t=TEAM[g][0];items[k].push({major:'',proj:name,team:t,div:pk(['장비','요소기술']),item:g,d,note:'',owner:''});
  });
  Object.keys(TEAM).forEach(g=>TEAM[g][1].forEach(p=>{const rk=RK[p.charCodeAt(0)%4];

  RAW.rows=rows;
  MASTERS=[{kind:'dev',stages:DEV_ST,items:items.dev},{kind:'ord',stages:ORD_ST,items:items.ord}];

  startApp();
}

  const API_URL = 'https://script.google.com/macros/s/AKfycbz5vKo4LGcyKyUiqks-L11pn0fS0LpPuQtan5Synkb_wqt8s3C9bW-OeW9qK1WldIiW/exec';
  /* ▲▲▲ ───────────────────────────────────────────────────────────────────────────────── ▲▲▲ */
  const API=API_URL.trim(), KEY='gst_sess';
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const lsGet=()=>{try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch{return null}};
  const lsSet=v=>{try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch{}};
  let SES=lsGet();
  const loading=on=>{try{window.GST.loading(on)}catch{}};
  async function get(params){
    const q=new URLSearchParams(Object.assign({token:SES&&SES.token},params));
    const r=await(await fetch(API+(API.includes('?')?'&':'?')+q)).json();
    if(r.error==='auth'){expired();throw new Error('로그인이 만료되었습니다')}
    return r;
  }
  async function post(body){
    const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:SES&&SES.token},body))})).json();
    if(r.error==='auth'){expired();throw new Error('로그인이 만료되었습니다')}
    return r;
  }
  const load=async()=>{const r=await get({action:'data'});if(r.error)throw new Error(r.error);return r};
  function expired(){SES=null;lsSet(null);show('로그인이 만료되었습니다. 다시 로그인해 주세요')}
  window.GSTAuth={get,post,load,logout(){SES=null;lsSet(null);show('')}};

  function show(msg){
    const L=document.getElementById('login');L.classList.add('on');
    L.innerHTML=`<div class="lc"><div class="lg">GST</div><h2>연구소 업무관리</h2><p>이름과 PIN으로 로그인하면 본인 업무로 접속됩니다.</p>
     <div class="fld"><label>이름</label><input id="lN" autocomplete="username"></div>
     <div class="fld"><label>PIN</label><input id="lP" type="password" autocomplete="current-password"></div>
     <div class="err" id="lE">${esc(msg||'')}</div><button class="pbtn" id="lGo">로그인</button></div>`;
    const E=t=>document.getElementById('lE').textContent=t;
    const go=async()=>{
      if(!API)return E('연결 URL이 설정되지 않았습니다 (login 파트의 API_URL 확인)');
      const name=document.getElementById('lN').value.trim(),pin=document.getElementById('lP').value;
      if(!name||!pin)return E('이름과 PIN을 입력해 주세요');
      E('');loading(true);
      try{
        const r=await(await fetch(API+(API.includes('?')?'&':'?')+new URLSearchParams({action:'login',name,pin}))).json();
        if(!r.ok){loading(false);return E(r.error||'로그인 실패')}
        SES={token:r.token,user:r.user};lsSet(SES);
        await enter();
      }catch(e){loading(false);E('연결 실패: URL · 배포 권한 · 사내망 차단 여부를 확인해 주세요')}
    };
    document.getElementById('lGo').onclick=go;
    document.getElementById('lP').onkeydown=e=>{if(e.key==='Enter')go()};
    document.getElementById('lN').onkeydown=e=>{if(e.key==='Enter')document.getElementById('lP').focus()};
  }
  async function enter(){
    loading(true);
    try{const d=await load();document.getElementById('login').classList.remove('on');window.GST.start({user:SES.user,token:SES.token,rows:d.rows,masters:d.masters,teams:d.teams,heads:d.heads})}
    finally{loading(false)}
  }
  if(API&&SES)enter().catch(()=>{SES=null;lsSet(null);show('')});else show('');
})();
</script>

</body>
</html>
